name: Capítulo del día

on:
  schedule:
    # Cada hora (al minuto 13, para evitar la congestión de la hora en punto).
    # En cada ejecución se envía solo a quienes ya les llegó la hora que eligieron
    # y todavía no recibieron el capítulo de hoy.
    - cron: '13 * * * *'
  workflow_dispatch:       # envío manual: le llega a todos los suscritos

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar firebase-admin
        run: npm install firebase-admin@12.7.0 --no-save --no-audit --no-fund
      - name: Enviar capítulo del día
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cat > enviar.cjs <<'FIN'
          // Envía el "Capítulo del día" a cada persona a la hora que eligió (se ejecuta cada hora)
          const NT = [['Mateo',28],['Marcos',16],['Lucas',24],['Juan',21],['Hechos',28],['Romanos',16],['1 Corintios',16],['2 Corintios',13],
            ['Gálatas',6],['Efesios',6],['Filipenses',4],['Colosenses',4],['1 Tesalonicenses',5],['2 Tesalonicenses',3],['1 Timoteo',6],
            ['2 Timoteo',4],['Tito',3],['Filemón',1],['Hebreos',13],['Santiago',5],['1 Pedro',5],['2 Pedro',3],['1 Juan',5],['2 Juan',1],
            ['3 Juan',1],['Judas',1],['Apocalipsis',22]];
          const LISTA = NT.flatMap(([libro, n]) => Array.from({ length: n }, (_, i) => ({ libro, cap: i + 1 })));
          const BIBLIA_URL = 'https://raw.githubusercontent.com/MJoelGV/biblia-poder-milagros/Original/biblia-files/Reina-Valera-1960.xmm';
          const ZONA_DEF = 'America/Chicago', HORA_DEF = 7;

          // Fecha (AAAA-MM-DD) y hora local de una zona horaria
          function ahoraEn(tz) {
            try {
              const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' })
                .formatToParts(new Date()).map(x => [x.type, x.value]));
              return { fecha: `${p.year}-${p.month}-${p.day}`, hora: parseInt(p.hour, 10) };
            } catch (e) { return tz === ZONA_DEF ? { fecha: '', hora: -1 } : ahoraEn(ZONA_DEF); }
          }
          function capituloDe(fecha) { // 1 nov 2026 = Mateo 1
            const [y, m, d] = fecha.split('-').map(Number);
            const dias = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2026, 10, 1)) / 86400000);
            return LISTA[((dias % LISTA.length) + LISTA.length) % LISTA.length];
          }
          function primerVersiculo(xml, libro, cap) {
            const ib = xml.indexOf(`<b n="${libro}"`); if (ib < 0) return '';
            const ic = xml.indexOf(`<c n="${cap}"`, ib); if (ic < 0) return '';
            const m = xml.slice(ic, ic + 5000).match(/<v n="1"[^>]*>([\s\S]*?)<\/v>/);
            if (!m) return '';
            const t = m[1].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
            return t.length > 110 ? t.slice(0, 107).replace(/\s+\S*$/, '') + '…' : t;
          }
          // Lee la clave aunque el celular haya convertido los "\n" en saltos de línea reales al copiarla
          function leerCuenta(texto) {
            let limpio = '', enCadena = false, escape = false;
            for (const ch of String(texto).trim()) {
              if (enCadena) {
                if (escape) { limpio += ch; escape = false; continue; }
                if (ch === '\\') { limpio += ch; escape = true; continue; }
                if (ch === '"') { enCadena = false; limpio += ch; continue; }
                if (ch === '\n') { limpio += '\\n'; continue; }
                if (ch === '\r') continue;
                if (ch < ' ') { limpio += ' '; continue; }
                limpio += ch;
              } else {
                if (ch === '"') enCadena = true;
                limpio += ch;
              }
            }
            const cuenta = JSON.parse(limpio);
            if (cuenta.private_key) cuenta.private_key = cuenta.private_key.replace(/\\n/g, '\n');
            return cuenta;
          }

          async function main() {
            const manual = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
            let xml = '';
            try { xml = await (await fetch(BIBLIA_URL)).text(); } catch (e) { console.warn('Sin Biblia:', e.message); }
            const mensajes = {}; // por fecha
            const mensajeDe = fecha => mensajes[fecha] || (mensajes[fecha] = (() => {
              const { libro, cap } = capituloDe(fecha);
              const texto = xml ? primerVersiculo(xml, libro, cap) : '';
              return {
                title: `📖 Capítulo del día: ${libro} ${cap}`,
                body: texto ? `«${texto}»` : 'Toca para leer el capítulo de hoy.',
                link: `lectura.html?book=${encodeURIComponent(libro)}&chapter=${cap}`,
                tag: 'capitulo-del-dia'
              };
            })());
            console.log('Hoy en Houston:', mensajeDe(ahoraEn(ZONA_DEF).fecha).title, manual ? '(envío manual a todos)' : '');
            if (process.env.SOLO_PRUEBA) return;

            const admin = require('firebase-admin');
            admin.initializeApp({ credential: admin.credential.cert(leerCuenta(process.env.FIREBASE_SERVICE_ACCOUNT)) });
            const db = admin.firestore();
            const snap = await db.collection('tokens').get();

            // A quién le toca: ya llegó su hora y todavía no recibió el de hoy (si una ejecución se salta, la siguiente lo recupera)
            const toca = [];
            snap.forEach(d => {
              const t = d.data();
              const ahora = ahoraEn(t.tz || ZONA_DEF);
              const hora = Number.isInteger(t.hora) ? t.hora : HORA_DEF;
              if (manual || (ahora.hora >= hora && t.ultimoEnvio !== ahora.fecha)) toca.push({ id: d.id, fecha: ahora.fecha });
            });
            console.log(`Suscritos: ${snap.size}. Les toca ahora: ${toca.length}.`);

            let enviados = 0, borrados = 0;
            for (let i = 0; i < toca.length; i += 500) {
              const lote = toca.slice(i, i + 500);
              const res = await admin.messaging().sendEach(lote.map(x => ({
                token: x.id, data: mensajeDe(x.fecha), webpush: { headers: { Urgency: 'normal', TTL: '43200' } }
              })));
              const batch = db.batch();
              res.responses.forEach((r, j) => {
                const ref = db.collection('tokens').doc(lote[j].id);
                if (r.success) { enviados++; batch.set(ref, { ultimoEnvio: lote[j].fecha }, { merge: true }); return; }
                const code = r.error && r.error.code;
                if (['messaging/registration-token-not-registered', 'messaging/invalid-argument', 'messaging/invalid-registration-token'].includes(code)) {
                  batch.delete(ref); borrados++;
                } else console.warn('Error:', code);
              });
              await batch.commit();
            }
            console.log(`Enviados: ${enviados}. Suscripciones vencidas borradas: ${borrados}.`);
          }
          main().catch(e => { console.error(e); process.exit(1); });

          FIN
          node enviar.cjs
