<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8F5">

<link rel="apple-touch-icon" href="icons/pymicon.png">
<meta name="application-name" content="BibliaPYM">

<title>Compartir versículo · Biblia de Poder y Milagros</title>
<style>
.pt { display:flex; align-items:center; gap:8px; }
.pt a { width:44px; height:44px; border-radius:22px; display:grid; place-items:center; color:var(--text); background:var(--surface); border:1px solid var(--border); flex-shrink:0; }
.pt h1 { margin:0; font-size:22px; }
.vista { position:relative; border-radius:20px; overflow:hidden; background:var(--border); box-shadow:0 10px 30px rgba(0,0,0,.14); margin:0 auto; width:100%; max-width:420px; }
.vista canvas { display:block; width:100%; height:auto; }
.cargando { position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-weight:700; background:rgba(0,0,0,.25); }
.campo { display:flex; flex-direction:column; gap:8px; }
.campo > span { font-size:14px; font-weight:700; color:var(--text-2); }
.selects { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; }
.selects select, .sel-ver { min-height:44px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-size:15px; padding:0 10px; width:100%; }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex-shrink:0; min-height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
.chip[aria-pressed="true"] { background:var(--accent-fill); border-color:var(--accent-fill); color:var(--on-accent); }
.fondos { display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
.fondos::-webkit-scrollbar { display:none; }
.fondo { flex-shrink:0; width:76px; height:76px; border-radius:14px; border:3px solid transparent; padding:0; overflow:hidden; cursor:pointer; background:var(--border); }
.fondo img { width:100%; height:100%; object-fit:cover; display:block; }
.fondo[aria-pressed="true"] { border-color:var(--accent-fill); }
.acciones { display:grid; grid-template-columns:2fr 1fr; gap:10px; position:sticky; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:5; }
.acciones .btn { height:52px; font-size:16px; }
.btn.sec { background:var(--surface); color:var(--text); border:1px solid var(--border); }
.aviso { text-align:center; color:var(--text-2); font-size:14px; min-height:20px; margin:0; }
</style>
</head>
<body>
<main class="page">
  <header class="pt"><a href="lectura.html" id="volver" aria-label="Volver a la lectura"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a><h1>Compartir versículo</h1></header>

  <div class="vista"><canvas id="lienzo" width="1080" height="1350" role="img" aria-label="Vista previa de la imagen del versículo"></canvas><div class="cargando" id="cargando">Preparando…</div></div>

  <div class="acciones"><button class="btn" type="button" id="compartir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Compartir imagen</button><button class="btn sec" type="button" id="descargar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Guardar</button></div>
  <p class="aviso" id="aviso" role="status" aria-live="polite"></p>

  <section class="campo"><span>Versículo</span>
    <select class="sel-ver" id="sel-version" aria-label="Versión"></select>
    <div class="selects"><select id="sel-libro" aria-label="Libro"></select><select id="sel-cap" aria-label="Capítulo"></select><select id="sel-vers" aria-label="Versículo"></select></div>
  </section>

  <section class="campo"><span>Tamaño</span>
    <div class="chips" role="group" aria-label="Tamaño de la imagen">
      <button class="chip" type="button" data-fmt="1080x1350">Publicación</button>
      <button class="chip" type="button" data-fmt="1080x1080">Cuadrada</button>
      <button class="chip" type="button" data-fmt="1080x1920">Estado / Historia</button>
    </div>
  </section>

  <section class="campo"><span>Letra</span>
    <div class="chips" role="group" aria-label="Estilo de letra">
      <button class="chip" type="button" data-letra="serif">Clásica</button>
      <button class="chip" type="button" data-letra="sans">Moderna</button>
    </div>
  </section>

  <section class="campo"><span>Fondo</span><div class="fondos" id="fondos" role="group" aria-label="Fondo"></div></section>
</main>

  <a href="mas.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Más</a>
</div></nav>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const FOTOS = ["https://images.unsplash.com/photo-1450558415837-1f5e21a17709", "https://images.unsplash.com/photo-1626494988966-4c3a81b3e056", "https://images.unsplash.com/photo-1709837420088-76dd8f588f53", "https://images.unsplash.com/photo-1562276400-da9c38382068", "https://images.unsplash.com/photo-1434077471918-4ea96e6e45d5", "https://images.unsplash.com/photo-1768326943626-a80f242a7970", "https://images.unsplash.com/photo-1465496980292-e83064a74e4f", "https://images.unsplash.com/photo-1757167426688-cac9332e6304", "https://images.unsplash.com/photo-1506905925346-21bda4d32df4", "https://images.unsplash.com/photo-1507525428034-b723cf961d3e", "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05", "https://images.unsplash.com/photo-1506744038136-46273834b3fb", "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa", "https://images.unsplash.com/photo-1501785888041-af3ef285b470", "https://images.unsplash.com/photo-1521295121783-8a321d551ad2", "https://images.unsplash.com/photo-1519904981063-b0cf448d479e", "https://images.unsplash.com/photo-1511884642898-4c92249e20b6", "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429"];
  const COLORES = [['#1B5E20', '#0F2E14'], ['#15201A', '#000000'], ['#3B1F4A', '#12285A'], ['#7A4A12', '#2B1A08']];
  const VERS = {
    rvg: ['RVG.xmm', 'Reina Valera Gómez', 'RVG'], rv1960: ['Reina-Valera-1960.xmm', 'Reina-Valera 1960', 'RVR1960'], rv1909: ['RV1909.xmm', 'Reina-Valera 1909', 'RV1909'],
    tla: ['TLA.xmm', 'Traducción en Lenguaje Actual', 'TLA'], dhh: ['Dios-Habla-Hoy.xmm', 'Dios Habla Hoy', 'DHH'],
    kjv: ['KJV.xmm', 'King James Version', 'KJV'], web: ['WEB.xmm', 'World English Bible', 'WEB'],
    lla: [null, 'La Biblia de las Américas', 'LBLA'], nbla: [null, 'Nueva Biblia de las Américas', 'NBLA'], ntv: [null, 'Nueva Traducción Viviente', 'NTV']
  };
  const p = new URLSearchParams(location.search);
  const normal = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  let version = VERS[(p.get('version') || '').toLowerCase()] ? p.get('version').toLowerCase() : (leerPref() || 'rvg');
  const textoFijo = p.get('texto') ? { t: p.get('texto'), b: normal(p.get('book')), c: p.get('chapter'), v: p.get('verse') } : null;
  let doc = null, libro = p.get('book') || 'Juan', cap = parseInt(p.get('chapter') || '3', 10), vers = parseInt(p.get('verse') || '16', 10);
  let fmt = localStorage.getItem('shareFmt') || '1080x1350', letra = localStorage.getItem('shareLetra') || 'serif', fondo = parseInt(localStorage.getItem('shareFondo') || '0', 10);
  const imgCache = {};
  function leerPref() {
    const m = { 'RVG': 'rvg', 'Reina-Valera-1960': 'rv1960', 'RV1909': 'rv1909', 'TLA': 'tla', 'Dios-Habla-Hoy': 'dhh', 'KJV': 'kjv', 'WEB': 'web' };
    try { return m[localStorage.getItem('lecturaVersion')]; } catch (e) { return null; }
  }
  function avisar(t) { $('aviso').textContent = t; }
  if (document.referrer && new URL(document.referrer).origin === location.origin) $('volver').addEventListener('click', e => { e.preventDefault(); history.back(); });

  // ---------- Texto ----------
  async function cargar(v) {
    const f = VERS[v][0] || 'RVG.xmm';
    const t = await (await fetch('biblia-files/' + f)).text();
    return new DOMParser().parseFromString(t.replace(/^\uFEFF/, ''), 'text/xml');
  }
  const libros = () => Array.from(doc.getElementsByTagName('b')).map(b => b.getAttribute('n'));
  const nodoB = n => Array.from(doc.getElementsByTagName('b')).find(b => b.getAttribute('n') === n);
  const caps = n => { const b = nodoB(n); return b ? b.getElementsByTagName('c').length : 0; };
  const versos = (n, c) => { const b = nodoB(n), cc = b && Array.from(b.getElementsByTagName('c')).find(x => x.getAttribute('n') === String(c)); return cc ? Array.from(cc.getElementsByTagName('v')).filter(v => v.getAttribute('n') !== '0') : []; };
  const textoDe = v => Array.from(v.childNodes).filter(n => n.nodeType === 3).map(n => n.textContent).join('').replace(/\s+/g, ' ').trim();
  function textoActual() {
    if (!VERS[version][0]) {
      if (textoFijo && normal(libro) === textoFijo.b && String(cap) === textoFijo.c && String(vers) === textoFijo.v) return textoFijo.t;
      version = 'rvg'; $('sel-version').value = 'rvg';
    }
    const v = versos(libro, cap).find(x => x.getAttribute('n') === String(vers));
    return v ? textoDe(v) : '';
  }
  function llenar(sel, items, val) { sel.innerHTML = items.map(([v, t]) => `<option value="${v}"${String(v) === String(val) ? ' selected' : ''}>${t}</option>`).join(''); }
  function llenarSelects() {
    llenar($('sel-libro'), libros().map(b => [b, b]), libro);
    const nc = caps(libro); llenar($('sel-cap'), Array.from({ length: nc }, (_, i) => [i + 1, i + 1]), cap);
    llenar($('sel-vers'), versos(libro, cap).map(v => [v.getAttribute('n'), v.getAttribute('n')]), vers);
  }

  // ---------- Dibujo en lienzo: nítido y sin cortar palabras ----------
  function cargarImg(url) {
    if (!imgCache[url]) imgCache[url] = new Promise((ok, mal) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    return imgCache[url];
  }
  function partir(ctx, texto, ancho) {
    const palabras = texto.split(' '), lineas = []; let linea = '';
    for (const w of palabras) {
      const prueba = linea ? linea + ' ' + w : w;
      if (ctx.measureText(prueba).width <= ancho || !linea) linea = prueba; else { lineas.push(linea); linea = w; }
    }
    if (linea) lineas.push(linea);
    return lineas;
  }
  let turno = 0;
  async function dibujar(cv) {
    const yo = ++turno;
    const [W, Hh] = fmt.split('x').map(Number);
    cv.width = W; cv.height = Hh;
    const ctx = cv.getContext('2d');
    // Fondo
    if (fondo < FOTOS.length) {
      try {
        const img = await cargarImg(`${FOTOS[fondo]}?auto=format&fit=crop&w=${W}&h=${Hh}&q=85`);
        if (yo !== turno) return;
        const k = Math.max(W / img.width, Hh / img.height), iw = img.width * k, ih = img.height * k;
        ctx.drawImage(img, (W - iw) / 2, (Hh - ih) / 2, iw, ih);
      } catch (e) { fondo = FOTOS.length; }
    }
    if (fondo >= FOTOS.length) {
      const [a, b] = COLORES[(fondo - FOTOS.length) % COLORES.length];
      const g = ctx.createLinearGradient(0, 0, W, Hh); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);
    }
    // Velo para que el texto se lea bien
    const v = ctx.createLinearGradient(0, 0, 0, Hh); v.addColorStop(0, 'rgba(0,0,0,.35)'); v.addColorStop(.5, 'rgba(0,0,0,.45)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, Hh);
    // Texto: busca el tamaño más grande que quepa sin partir palabras
    const texto = textoActual();
    const familia = letra === 'serif' ? '"Literata", Georgia, serif' : '"Plus Jakarta Sans", system-ui, sans-serif';
    await Promise.all([document.fonts.load(`500 60px ${familia}`), document.fonts.load('400 60px "Great Vibes"'), document.fonts.load('700 30px "Plus Jakarta Sans"')]).catch(() => {});
    if (yo !== turno) return;
    const margen = W * 0.1, ancho = W - margen * 2, altoMax = Hh * (fmt === '1080x1920' ? 0.5 : 0.56);
    let tam = 84, lineas = [];
    for (; tam >= 28; tam -= 2) {
      ctx.font = `500 ${tam}px ${familia}`;
      lineas = partir(ctx, `“${texto}”`, ancho);
      const ancha = Math.max(...lineas.map(l => ctx.measureText(l).width));
      if (lineas.length * tam * 1.38 <= altoMax && ancha <= ancho) break;
    }
    const alto = lineas.length * tam * 1.38;
    let y = Hh / 2 - alto / 2 - tam * 0.2;
    ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 2;
    lineas.forEach(l => { ctx.fillText(l, W / 2, y); y += tam * 1.38; });
    // Cita
    ctx.font = `700 ${Math.round(tam * 0.62 + 6)}px "Plus Jakarta Sans", system-ui, sans-serif`;
    ctx.fillStyle = '#F2D48A';
    ctx.fillText(`${libro} ${cap}:${vers} · ${VERS[version][2]}`, W / 2, y + tam * 0.55);
    // Firma de la app
    ctx.shadowBlur = 10;
    ctx.font = '400 54px "Great Vibes", cursive'; ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.fillText('Biblia de Poder y Milagros', W / 2, Hh - Hh * 0.075 - 54);
    ctx.shadowBlur = 0;
    if (cv.id === 'lienzo') $('cargando').hidden = true;
  }
  const repintar = () => dibujar($('lienzo')).catch(e => console.warn(e));

  // ---------- Compartir y guardar ----------
  async function imagen() {
    const cv = document.createElement('canvas');
    await dibujar(cv);
    return new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.95));
  }
  const nombreArchivo = () => `${libro}-${cap}-${vers}.jpg`.replace(/\s+/g, '-');
  $('compartir').addEventListener('click', async () => {
    avisar('Preparando la imagen…');
    try {
      const blob = await imagen(), file = new File([blob], nombreArchivo(), { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: `${libro} ${cap}:${vers}` }); avisar(''); }
      else { descargarBlob(blob); avisar('Tu celular no permite compartir directo; la imagen se guardó.'); }
    } catch (e) { if (e.name !== 'AbortError') avisar('No se pudo crear la imagen. Prueba con otro fondo.'); else avisar(''); }
  });
  function descargarBlob(blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombreArchivo(); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
  $('descargar').addEventListener('click', async () => { avisar('Preparando la imagen…'); try { descargarBlob(await imagen()); avisar('Imagen guardada'); } catch (e) { avisar('No se pudo crear la imagen. Prueba con otro fondo.'); } });

  // ---------- Controles ----------
  function marcar(sel, attr, val) { document.querySelectorAll(`[${attr}]`).forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute(attr) === String(val)))); }
  document.querySelectorAll('[data-fmt]').forEach(b => b.addEventListener('click', () => { fmt = b.dataset.fmt; localStorage.setItem('shareFmt', fmt); marcar(null, 'data-fmt', fmt); repintar(); }));
  document.querySelectorAll('[data-letra]').forEach(b => b.addEventListener('click', () => { letra = b.dataset.letra; localStorage.setItem('shareLetra', letra); marcar(null, 'data-letra', letra); repintar(); }));
  $('fondos').innerHTML = FOTOS.map((f, i) => `<button class="fondo" type="button" data-fondo="${i}" aria-label="Foto ${i + 1}"><img src="${f}?auto=format&fit=crop&w=160&h=160&q=70" alt="" loading="lazy"></button>`).join('')
    + COLORES.map(([a, b], i) => `<button class="fondo" type="button" data-fondo="${FOTOS.length + i}" aria-label="Color ${i + 1}" style="background:linear-gradient(135deg,${a},${b})"></button>`).join('');
  $('fondos').addEventListener('click', e => { const b = e.target.closest('[data-fondo]'); if (!b) return; fondo = parseInt(b.dataset.fondo, 10); localStorage.setItem('shareFondo', fondo); marcar(null, 'data-fondo', fondo); repintar(); });
  llenar($('sel-version'), Object.entries(VERS).filter(([k, v]) => v[0] || (textoFijo && k === version)).map(([k, v]) => [k, v[1]]), version);
  $('sel-version').addEventListener('change', async () => { version = $('sel-version').value; doc = await cargar(version); llenarSelects(); repintar(); });
  $('sel-libro').addEventListener('change', () => { libro = $('sel-libro').value; cap = 1; vers = 1; llenarSelects(); repintar(); });
  $('sel-cap').addEventListener('change', () => { cap = parseInt($('sel-cap').value, 10); vers = 1; llenarSelects(); repintar(); });
  $('sel-vers').addEventListener('change', () => { vers = parseInt($('sel-vers').value, 10); repintar(); });
  marcar(null, 'data-fmt', fmt); marcar(null, 'data-letra', letra); marcar(null, 'data-fondo', fondo);

  (async function () {
    try { doc = await cargar(version); } catch (e) { version = 'rvg'; doc = await cargar('rvg'); }
    const L = libros(); libro = L.find(b => normal(b) === normal(libro)) || 'Juan';
    if (!caps(libro) || cap > caps(libro)) cap = 1;
    llenarSelects(); repintar();
  })();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="cuenta.js"></script>
