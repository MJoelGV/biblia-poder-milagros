.velo { position: fixed; inset: 0; z-index: 60; background: rgba(15,20,18,.42); opacity: 0; pointer-events: none; transition: opacity .3s; }
.velo.on { opacity: 1; pointer-events: auto; }
.hoja { position: fixed; z-index: 70; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px; background: var(--surface); color: var(--text); border-radius: 24px 24px 0 0;

                    "Hebreos 12-13, Tito",
                    "1 Timoteo",
                    "2 Timoteo, Filemón",
                    "1 Pedro",
                    "Salmos 144-146",
                    "1 Juan",
                    "2 Pedro, 2 Juan, 3 Juan, Judas",
                    "Apocalipsis 1-4",
                    "Apocalipsis 5-7",
                    "Apocalipsis 8-11",
                    "Apocalipsis 12-13",
                    "Salmos 147-150",
                    "Apocalipsis 14-16",
                    "Apocalipsis 17-19",
                    "Apocalipsis 20-22"
                ]
            }
        ]
  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const chev = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'.replace('<svg', '<svg class="chev"');
  const hoyF = new Date(), anio = hoyF.getFullYear();
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clave = (m, d) => `${anio}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const diasReales = m => new Date(anio, m, 0).getDate();
  // Lecturas de cada día; si el plan trae más días que el mes (29 de febrero en años normales), se juntan en el último día
  function lecturasDe(m, d) {
    const r = readingPlan[m - 1].readings, n = diasReales(m);
    if (d < n) return r[d - 1] ? [r[d - 1]] : [];
    return r.slice(n - 1).filter(Boolean);
  }
  function leerHechos() { try { return JSON.parse(localStorage.getItem('completedDays')) || {}; } catch (e) { return {}; } }
  function guardarHechos(h) {
    try {
      localStorage.setItem('completedDays', JSON.stringify(h));
      // También se guarda el resumen por mes que usaba la versión anterior
      localStorage.setItem('iphcReadingProgress', JSON.stringify(readingPlan.map((mm, i) => ({ month: mm.month, completed: Array.from({ length: diasReales(i + 1) }, (_, k) => h[clave(i + 1, k + 1)] ? 1 : 0).reduce((a, b) => a + b, 0) }))));
    } catch (e) {}
  }
  // "Hechos 18:12-19:41, Efesios 1-2" -> [{texto, libro, cap, vers}]
  function pasajes(txt) {
    return txt.split(/,\s*(?=\d?\s?[A-Za-zÁÉÍÓÚÑáéíóúñ])/).map(p => {
      const m = p.trim().match(/^((?:\d\s)?[A-Za-zÁÉÍÓÚÑáéíóúñü ]+?)\s*(?:(\d+)(?::(\d+))?|$)/);
      return { texto: p.trim(), libro: m ? m[1].trim() : p.trim(), cap: m && m[2] ? m[2] : 1, vers: m && m[3] ? m[3] : 0 };
    });
  }
  const enlace = p => `../lectura.html?book=${encodeURIComponent(p.libro)}&chapter=${p.cap}${p.vers ? '&verse=' + p.vers : ''}`;
  const lecturasHTML = (m, d) => lecturasDe(m, d).flatMap(pasajes).map(p => `<a class="lec" href="${enlace(p)}"><span>${esc(p.texto)}</span>${chev}</a>`).join('');

  const mesHoy = hoyF.getMonth() + 1, diaHoy = hoyF.getDate();
  function pintar() {
    const h = leerHechos();
    let total = 0, hechos = 0, atrasados = 0;
    let html = '';
    for (let m = 1; m <= 12; m++) {
      const n = diasReales(m), inicio = new Date(anio, m - 1, 1).getDay();
      let cel = '', hm = 0;
      for (let i = 0; i < inicio; i++) cel += '<span class="vacio"></span>';
      for (let d = 1; d <= n; d++) {
        const hecho = !!h[clave(m, d)], esHoy = m === mesHoy && d === diaHoy;
        const futuro = m > mesHoy || (m === mesHoy && d > diaHoy);
        if (hecho) hm++;
        if (!hecho && !futuro && !esHoy) atrasados++;
        cel += `<button class="dia${hecho ? ' hecho' : ''}${esHoy ? ' es-hoy' : ''}${futuro ? ' futuro' : ''}" type="button" data-m="${m}" data-d="${d}" aria-label="${d} de ${MESES[m - 1]}${hecho ? ', leído' : ''}${esHoy ? ', hoy' : ''}">${d}</button>`;
      }
      total += n; hechos += hm;
      const pct = Math.round(hm / n * 100);
      html += `<section class="mes" id="mes-${m}" aria-label="${MESES[m - 1]}"><div class="mes-h"><h3>${MESES[m - 1]}</h3><span>${hm}/${n} días</span></div>
        <div class="barra" aria-hidden="true"><i style="width:${pct}%"></i></div>
        <div class="semana" aria-hidden="true"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
        <div class="dias">${cel}</div></section>`;
    }
    document.getElementById('meses').innerHTML = html;
    document.getElementById('total-hechos').textContent = hechos;
    document.getElementById('total-dias').textContent = total;
    const pct = Math.round(hechos / total * 100);
    document.getElementById('total-porc').textContent = pct + '%';
    document.getElementById('barra-total-i').style.width = pct + '%';
    document.getElementById('barra-total').setAttribute('aria-valuemax', total);
    document.getElementById('barra-total').setAttribute('aria-valuenow', hechos);
    const hecho = !!h[clave(mesHoy, diaHoy)];
    document.getElementById('hoy').innerHTML = `<small>Lectura de hoy · ${diaHoy} de ${MESES[mesHoy - 1].toLowerCase()}</small>
      <div class="lecturas">${lecturasHTML(mesHoy, diaHoy)}</div>
      <button class="btn${hecho ? ' hecho' : ''}" type="button" data-marcar="${mesHoy}-${diaHoy}">${hecho ? '✓ Leído hoy' : 'Ya lo leí'}</button>
      ${atrasados ? `<p class="aviso-atras">Tienes ${atrasados} ${atrasados === 1 ? 'día anterior' : 'días anteriores'} sin marcar. Puedes ponerte al día tocándolos en el calendario.</p>` : ''}`;
  }

  function alternar(m, d) {
    const h = leerHechos(), k = clave(m, d);
    if (h[k]) delete h[k]; else h[k] = true;
    guardarHechos(h); pintar();
    return !!h[k];
  }

  // Hoja con las lecturas de un día
  let abierto = null;
  function abrirDia(m, d) {
    abierto = { m, d };
    document.getElementById('h-fecha').textContent = `${d} de ${MESES[m - 1]}`;
    document.getElementById('h-lecturas').innerHTML = lecturasHTML(m, d) || '<p class="aviso-atras">Este día no tiene lecturas.</p>';
    pintarBoton();
    document.getElementById('velo').classList.add('on');
    requestAnimationFrame(() => document.getElementById('hoja').classList.add('on'));
    setTimeout(() => document.getElementById('h-cerrar').focus({ preventScroll: true }), 350);
  }
  function pintarBoton() {
    const hecho = !!leerHechos()[clave(abierto.m, abierto.d)];
    const b = document.getElementById('h-marcar');
    b.textContent = hecho ? '✓ Leído (tocar para desmarcar)' : 'Marcar como leído';
    b.classList.toggle('hecho', hecho);
  }
  function cerrar() { document.getElementById('hoja').classList.remove('on'); document.getElementById('velo').classList.remove('on'); abierto = null; }
  document.getElementById('velo').addEventListener('click', cerrar);
  document.getElementById('h-cerrar').addEventListener('click', cerrar);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && abierto) cerrar(); });
  document.getElementById('h-marcar').addEventListener('click', () => {
    if (!abierto) return;
    const ahora = alternar(abierto.m, abierto.d);
    pintarBoton();
    if (ahora) setTimeout(cerrar, 450);
  });
  document.addEventListener('click', e => {
    const dia = e.target.closest('.dia');
    if (dia) { abrirDia(parseInt(dia.dataset.m, 10), parseInt(dia.dataset.d, 10)); return; }
    const mk = e.target.closest('[data-marcar]');
    if (mk) { const [m, d] = mk.dataset.marcar.split('-').map(Number); alternar(m, d); }
  });
  let y0 = null;
  document.getElementById('hoja').addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  document.getElementById('hoja').addEventListener('touchmove', e => { if (y0 !== null && e.touches[0].clientY - y0 > 70) { y0 = null; cerrar(); } }, { passive: true });

  pintar();
  // Al entrar: ir al mes actual y hacer brillar el día de hoy
  setTimeout(() => {
    const sinMov = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mes = document.getElementById('mes-' + mesHoy);
    if (mes) mes.scrollIntoView({ behavior: sinMov ? 'auto' : 'smooth', block: 'start' });
    setTimeout(() => {
      const hoy = document.querySelector('.dia.es-hoy');
      if (hoy) { hoy.classList.add('brillo'); setTimeout(() => hoy.classList.remove('brillo'), 2300); }
    }, sinMov ? 0 : 700);
  }, 600);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="../cuenta.js"></script>
</body>
