<title>30 días con Jesús · Biblia de Poder y Milagros</title>
<style>
.p30-top { display: flex; align-items: center; gap: 8px; }
.p30-top a { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--text); background: var(--surface); border: 1px solid var(--border); flex-shrink: 0; }
.p30-top h1 { margin: 0; font-size: 18px; font-weight: 700; }
.hero { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.hero .titulo { font-family: 'Great Vibes', cursive; font-size: 44px; line-height: 1; color: var(--text); margin: 0; }
.hero .sub { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.5; }
.barra { height: 10px; border-radius: 5px; background: var(--border); overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--accent-fill); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.cuenta { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--text-2); }
.cuenta b { font-size: 22px; color: var(--text); }
.siguiente { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: var(--accent-soft); }
.siguiente small { font-size: 13px; font-weight: 700; color: var(--accent); }
.siguiente b { font-size: 18px; line-height: 1.3; }
.siguiente .ref { font-size: 14px; color: var(--text-2); }
.fila-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.fila-btns .btn { flex: 1; min-width: 140px; }
.btn.sec { background: transparent; color: var(--text); border: 1px solid var(--border); }
.dias { display: flex; flex-direction: column; gap: 10px; }
.dia { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); transition: opacity .3s; }
.dia.actual { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.check { width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; border: 2px solid var(--border); background: var(--surface); color: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .2s, border-color .2s, color .2s; }
.check[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.18); } }
.dia a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; color: var(--text); }
.dia .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dia .n { font-size: 12px; font-weight: 700; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.dia .chip { background: var(--accent-fill); color: var(--on-accent); font-size: 11px; padding: 2px 8px; border-radius: 999px; }
.dia .t { font-size: 16px; font-weight: 600; line-height: 1.3; }
.dia .r { font-size: 14px; color: var(--accent); font-weight: 600; }
.dia.hecho .t { color: var(--text-2); }
.dia.brillo { animation: brillo 2.2s ease-out; }
@keyframes brillo {
  0% { box-shadow: 0 0 0 1px var(--accent), 0 0 0 0 rgba(46,125,50,.55); }
  30% { box-shadow: 0 0 0 1px var(--accent), 0 0 22px 8px rgba(46,125,50,.35); transform: scale(1.02); }
  100% { box-shadow: 0 0 0 1px var(--accent), 0 0 0 0 rgba(46,125,50,0); transform: none; }
}
.fiesta { text-align: center; font-size: 15px; font-weight: 600; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .dia.brillo { animation: none; } .check[aria-pressed="true"] { animation: none; } .barra i { transition: none; } }
</style>
</head>
<body>
<main class="page">
  <header class="p30-top">
    <a href="../planes-estudio.html" aria-label="Volver a los planes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <h1>Plan de lectura</h1>
  </header>

  <section class="hero" aria-labelledby="t30">
    <h2 class="titulo" id="t30">30 días con Jesús</h2>
    <p class="sub">Recorre la vida y las enseñanzas de Jesús en 30 lecturas cortas. Marca cada día al terminar; tu avance se guarda solo.</p>
    <div>
      <div class="cuenta"><span><b id="hechos">0</b> de 30 días</span><span id="porc">0%</span></div>
      <div class="barra" role="progressbar" aria-label="Avance del plan" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" id="barra"><i id="barra-i"></i></div>
    </div>
    <div class="siguiente" id="siguiente"></div>
  </section>

  <section aria-labelledby="tdias" style="display:flex;flex-direction:column;gap:12px">
    <h2 class="sec" id="tdias">Los 30 días</h2>
    <div class="dias" id="dias"></div>
  </section>
</main>

  <a href="../index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="../lectura.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/><path d="M12 6v8M9 9h6"/></svg>Biblia</a>
  <a href="../planes-estudio.html" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg>Planes</a>
  <a href="../predicaciones.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>Prédicas</a>
  <a href="../mas.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Más</a>
</div></nav>

<script>
(function () {
  const plan30Dias = [
            { day: 1, title: "El Nacimiento de Jesús", reference: "Lucas 2:1-20", libro: "LUK", capitulo: "2", versiculo: "1" },
            { day: 2, title: "El Bautismo de Jesús", reference: "Mateo 3:13-17", libro: "MAT", capitulo: "3", versiculo: "13" },
            { day: 3, title: "Las Tentaciones en el Desierto", reference: "Mateo 4:1-11", libro: "MAT", capitulo: "4", versiculo: "1" },
            { day: 4, title: "Las Bienaventuranzas", reference: "Mateo 5:1-12", libro: "MAT", capitulo: "5", versiculo: "1" },
            { day: 5, title: "La Sal de la Tierra", reference: "Mateo 5:13-16", libro: "MAT", capitulo: "5", versiculo: "13" },
            { day: 6, title: "El Sermón del Monte (capítulos 5, 6 y 7)", reference: "Mateo 5-7", libro: "MAT", capitulo: "5", versiculo: "1" },
            { day: 7, title: "La Oración del Señor", reference: "Mateo 6:9-13", libro: "MAT", capitulo: "6", versiculo: "9" },
            { day: 8, title: "La Pesca Milagrosa", reference: "Lucas 5:1-11", libro: "LUK", capitulo: "5", versiculo: "1" },
            { day: 9, title: "La Fe del Centurión", reference: "Mateo 8:5-13", libro: "MAT", capitulo: "8", versiculo: "5" },
            { day: 10, title: "Jesús Calma la Tormenta", reference: "Marcos 4:35-41", libro: "MRK", capitulo: "4", versiculo: "35" },
            { day: 11, title: "La Hija de Jairo", reference: "Marcos 5:21-43", libro: "MRK", capitulo: "5", versiculo: "21" },
            { day: 12, title: "La Alimentación de los 5,000", reference: "Juan 6:1-15", libro: "JHN", capitulo: "6", versiculo: "1" },
            { day: 13, title: "Jesús Camina sobre el Agua", reference: "Mateo 14:22-33", libro: "MAT", capitulo: "14", versiculo: "22" },
            { day: 14, title: "La Confesión de Pedro", reference: "Mateo 16:13-20", libro: "MAT", capitulo: "16", versiculo: "13" },
            { day: 15, title: "La Transfiguración", reference: "Mateo 17:1-13", libro: "MAT", capitulo: "17", versiculo: "1" },
            { day: 16, title: "El Hijo Pródigo", reference: "Lucas 15:11-32", libro: "LUK", capitulo: "15", versiculo: "11" },
            { day: 17, title: "El Buen Samaritano", reference: "Lucas 10:25-37", libro: "LUK", capitulo: "10", versiculo: "25" },
            { day: 18, title: "Zaqueo el Recaudador", reference: "Lucas 19:1-10", libro: "LUK", capitulo: "19", versiculo: "1" },
            { day: 19, title: "Jesús y los Niños", reference: "Marcos 10:13-16", libro: "MRK", capitulo: "10", versiculo: "13" },
            { day: 20, title: "El Joven Rico", reference: "Marcos 10:17-31", libro: "MRK", capitulo: "10", versiculo: "17" },
            { day: 21, title: "La Entrada Triunfal", reference: "Juan 12:12-19", libro: "JHN", capitulo: "12", versiculo: "12" },
            { day: 22, title: "La Última Cena", reference: "Mateo 26:17-30", libro: "MAT", capitulo: "26", versiculo: "17" },
            { day: 23, title: "Jesús en Getsemaní", reference: "Mateo 26:36-46", libro: "MAT", capitulo: "26", versiculo: "36" },
            { day: 24, title: "El Juicio de Jesús", reference: "Juan 18:28-40", libro: "JHN", capitulo: "18", versiculo: "28" },
            { day: 25, title: "La Crucifixión", reference: "Juan 19:16-30", libro: "JHN", capitulo: "19", versiculo: "16" },
            { day: 26, title: "La Resurrección", reference: "Juan 20:1-18", libro: "JHN", capitulo: "20", versiculo: "1" },
            { day: 27, title: "Jesús y Tomás", reference: "Juan 20:24-29", libro: "JHN", capitulo: "20", versiculo: "24" },
            { day: 28, title: "La Pesca Milagrosa (Después de la Resurrección)", reference: "Juan 21:1-14", libro: "JHN", capitulo: "21", versiculo: "1" },
            { day: 29, title: "La Gran Comisión", reference: "Mateo 28:16-20", libro: "MAT", capitulo: "28", versiculo: "16" },
            { day: 30, title: "La Ascensión", reference: "Hechos 1:6-11", libro: "ACT", capitulo: "1", versiculo: "6" }
        ];
  const CLAVE = '30diasConJesucristo';
  const ok = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  const flecha = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'.replace('<svg', '<svg class="chev"');
  function leer() {
    try { const p = JSON.parse(localStorage.getItem(CLAVE)); if (p && Array.isArray(p.diasCompletados)) return p; } catch (e) {}
    return { diasCompletados: [], ultimoDiaAccedido: 1, fechaInicio: new Date().toISOString() };
  }
  function guardar(p) { try { localStorage.setItem(CLAVE, JSON.stringify(p)); } catch (e) {} }
  const libroDe = d => d.reference.replace(/\s+\d.*$/, '');
  const enlace = d => `../lectura.html?book=${encodeURIComponent(libroDe(d))}&chapter=${d.capitulo}&verse=${d.versiculo || 1}`;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function pintar() {
    const p = leer(), hechos = new Set(p.diasCompletados.map(Number));
    const n = hechos.size, pct = Math.round(n / 30 * 100);
    document.getElementById('hechos').textContent = n;
    document.getElementById('porc').textContent = pct + '%';
    document.getElementById('barra-i').style.width = pct + '%';
    document.getElementById('barra').setAttribute('aria-valuenow', n);
    const sig = plan30Dias.find(d => !hechos.has(d.day));
    const caja = document.getElementById('siguiente');
    if (sig) {
      caja.innerHTML = `<small>${n === 0 ? 'Empieza aquí' : 'Tu siguiente lectura'}</small>
        <b>Día ${sig.day}: ${esc(sig.title)}</b><span class="ref">${esc(sig.reference)}</span>
        <div class="fila-btns"><a class="btn" href="${enlace(sig)}" data-leer="${sig.day}">Leer ahora</a><button class="btn sec" type="button" data-marcar="${sig.day}">Ya lo leí</button></div>`;
    } else {
      caja.innerHTML = '<p class="fiesta">🎉 ¡Completaste los 30 días con Jesús! Que lo aprendido siga dando fruto.</p>';
    }
    document.getElementById('dias').innerHTML = plan30Dias.map(d => {
      const hecho = hechos.has(d.day), actual = sig && d.day === sig.day;
      return `<div class="dia${hecho ? ' hecho' : ''}${actual ? ' actual' : ''}">
        <button class="check" type="button" data-marcar="${d.day}" aria-pressed="${hecho}" aria-label="Día ${d.day} ${hecho ? 'completado' : 'sin completar'}">${ok}</button>
        <a href="${enlace(d)}" data-leer="${d.day}"><span class="txt"><span class="n">Día ${d.day}${actual ? '<span class="chip">Siguiente</span>' : ''}</span><span class="t">${esc(d.title)}</span><span class="r">${esc(d.reference)}</span></span>${flecha}</a>
      </div>`;
    }).join('');
  }

  document.addEventListener('click', e => {
    const m = e.target.closest('[data-marcar]');
    if (m) {
      const dia = parseInt(m.dataset.marcar, 10), p = leer();
      const set = new Set(p.diasCompletados.map(Number));
      set.has(dia) ? set.delete(dia) : set.add(dia);
      p.diasCompletados = [...set].sort((a, b) => a - b);
      guardar(p); pintar();
      return;
    }
    const l = e.target.closest('[data-leer]');
    if (l) { const p = leer(); p.ultimoDiaAccedido = parseInt(l.dataset.leer, 10); guardar(p); }
  });

  pintar();
  // Al entrar, el día que sigue brilla un momento (como el día de hoy en la Biblia en un año)
  setTimeout(() => {
    const act = document.querySelector('.dia.actual');
    if (!act) return;
    const r = act.getBoundingClientRect();
    if (r.top > innerHeight - 100) act.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
    setTimeout(() => { act.classList.add('brillo'); setTimeout(() => act.classList.remove('brillo'), 2300); }, r.top > innerHeight - 100 ? 600 : 0);
  }, 500);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="../cuenta.js"></script>
</body>
</html>
