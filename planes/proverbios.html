<title>Proverbios: sabiduría diaria · Biblia de Poder y Milagros</title>
<style>
.pt { display: flex; align-items: center; gap: 8px; }
.pt a { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--text); background: var(--surface); border: 1px solid var(--border); flex-shrink: 0; }
.pt h1 { margin: 0; font-size: 18px; font-weight: 700; }
.hero { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.hero .titulo { font-family: 'Great Vibes', cursive; font-size: 42px; line-height: 1.05; margin: 0; }
.hero .sub { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.5; }
.barra { height: 10px; border-radius: 5px; background: var(--border); overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--accent-fill); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.cuenta { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--text-2); }
.cuenta b { font-size: 22px; color: var(--text); }
.hoy { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: var(--accent-soft); }
.hoy small { font-size: 13px; font-weight: 700; color: var(--accent); }
.hoy q { font-family: Georgia, serif; font-style: italic; font-size: 16px; line-height: 1.5; quotes: "«" "»"; }
.fila-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.fila-btns .btn { flex: 1; min-width: 120px; }
.btn.sec { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn.hecho { background: transparent; color: var(--accent); border: 2px solid var(--accent-fill); }
.dias { display: flex; flex-direction: column; gap: 10px; }
.dia { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); }
.dia.actual { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dia.brillo, .hoy.brillo { animation: brillo 2.2s ease-out; }
@keyframes brillo { 30% { box-shadow: 0 0 0 1px var(--accent), 0 0 22px 8px rgba(46,125,50,.35); transform: scale(1.02); } }
.check { width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; border: 2px solid var(--border); background: var(--surface); color: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .2s, border-color .2s, color .2s; }
.check[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.18); } }
.dia a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; color: var(--text); }
.dia .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dia .n { font-size: 12px; font-weight: 700; color: var(--text-2); display: flex; gap: 6px; align-items: center; }
.dia .chip { background: var(--accent-fill); color: var(--on-accent); font-size: 11px; padding: 2px 8px; border-radius: 999px; }
.dia .t { font-size: 16px; font-weight: 700; }
.dia .r { font-size: 14px; color: var(--text-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dia.hecho .t { color: var(--text-2); }
.reinicio { align-self: center; background: none; border: 0; color: var(--text-2); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; min-height: 44px; }
@media (prefers-reduced-motion: reduce) { .hoy.brillo, .dia.brillo, .check[aria-pressed="true"] { animation: none; } .barra i { transition: none; } }
</style>
</head>
<body>
<main class="page">
  <header class="pt"><a href="../planes-estudio.html" aria-label="Volver a los planes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a><h1>Plan de lectura</h1></header>
  <section class="hero" aria-labelledby="tp">
    <h2 class="titulo" id="tp">Proverbios: sabiduría diaria</h2>
    <p class="sub">Proverbios tiene 31 capítulos, uno para cada día del mes. Lee el que corresponde a la fecha de hoy y vuelve a empezar cada mes.</p>
    <div>
      <div class="cuenta"><span><b id="hechos">0</b> de 31 capítulos</span><span id="porc">0%</span></div>
      <div class="barra" role="progressbar" aria-label="Avance del plan" aria-valuemin="0" aria-valuemax="31" aria-valuenow="0" id="barra"><i id="barra-i"></i></div>
    </div>
    <div class="hoy" id="hoy"></div>
  </section>
  <section aria-labelledby="tdias" style="display:flex;flex-direction:column;gap:12px">
    <h2 class="sec" id="tdias">Los 31 capítulos</h2>
    <div class="dias" id="dias"></div>
    <button class="reinicio" type="button" id="reiniciar">Empezar de nuevo (desmarcar todo)</button>
  </section>
</main>

</div></nav>

<script src="../audio-biblia.js"></script>
<script>
(function () {
  const INICIOS = ["Los proverbios de Salomón, hijo de David, rey de Israel.", "Hijo mío, si recibieres mis palabras, Y mis mandamientos guardares dentro de ti,", "Hijo mío, no te olvides de mi ley, Y tu corazón guarde mis mandamientos;", "Oíd, hijos, la enseñanza de un padre, Y estad atentos, para que conozcáis cordura.", "Hijo mío, está atento a mi sabiduría, Y a mi inteligencia inclina tu oído,", "Hijo mío, si salieres fiador por tu amigo, Si has empeñado tu palabra a un extraño,", "Hijo mío, guarda mis razones, Y atesora contigo mis mandamientos.", "¿No clama la sabiduría, Y da su voz la inteligencia?", "La sabiduría edificó su casa, Labró sus siete columnas.", "Los proverbios de Salomón. El hijo sabio alegra al padre, Pero el hijo necio es…", "El peso falso es abominación a Jehová; Mas la pesa cabal le agrada.", "El que ama la instrucción ama la sabiduría; Mas el que aborrece la reprensión es…", "El hijo sabio recibe el consejo del padre; Mas el burlador no escucha las reprensiones.", "La mujer sabia edifica su casa; Mas la necia con sus manos la derriba.", "La blanda respuesta quita la ira; Mas la palabra áspera hace subir el furor.", "Del hombre son las disposiciones del corazón; Mas de Jehová es la respuesta de la lengua.", "Mejor es un bocado seco, y en paz, Que casa de contiendas llena de provisiones.", "Su deseo busca el que se desvía, Y se entremete en todo negocio.", "Mejor es el pobre que camina en integridad, Que el de perversos labios y fatuo.", "El vino es escarnecedor, la sidra alborotadora, Y cualquiera que por ellos yerra no es…", "Como los repartimientos de las aguas, Así está el corazón del rey en la mano de…", "De más estima es el buen nombre que las muchas riquezas, Y la buena fama más que la…", "Cuando te sientes a comer con algún señor, Considera bien lo que está delante de ti,", "No tengas envidia de los hombres malos, Ni desees estar con ellos;", "También estos son proverbios de Salomón, los cuales copiaron los varones de Ezequías,…", "Como no conviene la nieve en el verano, ni la lluvia en la siega, Así no conviene al…", "No te jactes del día de mañana; Porque no sabes qué dará de sí el día.", "Huye el impío sin que nadie lo persiga; Mas el justo está confiado como un león.", "El hombre que reprendido endurece la cerviz, De repente será quebrantado, y no habrá…", "Palabras de Agur, hijo de Jaqué; la profecía que dijo el varón a Itiel, a Itiel y a Ucal.", "Palabras del rey Lemuel; la profecía con que le enseñó su madre."];
  const CLAVE = 'proverbiosPlan';
  const ok = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>', hp = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>';
  const chev = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'.replace('<svg', '<svg class="chev"');
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const leer = () => { try { const p = JSON.parse(localStorage.getItem(CLAVE)); if (p && Array.isArray(p.hechos)) return p; } catch (e) {} return { hechos: [] }; };
  const guardar = p => { try { localStorage.setItem(CLAVE, JSON.stringify(p)); } catch (e) {} };
  const enlace = c => `../lectura.html?book=Proverbios&chapter=${c}`;
  const hoyCap = new Date().getDate();
  function pintar() {
    const h = new Set(leer().hechos.map(Number)), n = h.size, pct = Math.round(n / 31 * 100);
    document.getElementById('hechos').textContent = n;
    document.getElementById('porc').textContent = pct + '%';
    document.getElementById('barra-i').style.width = pct + '%';
    document.getElementById('barra').setAttribute('aria-valuenow', n);
    const leido = h.has(hoyCap);
    const oir = window.AudioBiblia ? window.AudioBiblia.enlace('Proverbios', hoyCap, '../') : '../audio.html';
    document.getElementById('hoy').innerHTML = `<small>Hoy, ${new Date().toLocaleDateString('es', { day: 'numeric', month: 'long' })}: Proverbios ${hoyCap}</small>
      <q>${esc(INICIOS[hoyCap - 1])}</q>
      <div class="fila-btns"><a class="btn" href="${enlace(hoyCap)}">Leer ahora</a><a class="btn sec" href="${oir}">${hp}Escuchar</a></div>
      <button class="btn${leido ? ' hecho' : ''}" type="button" data-marcar="${hoyCap}">${leido ? '✓ Leído hoy' : 'Ya lo leí'}</button>`;
    document.getElementById('dias').innerHTML = INICIOS.map((t, i) => {
      const c = i + 1, hecho = h.has(c), actual = c === hoyCap;
      return `<div class="dia${hecho ? ' hecho' : ''}${actual ? ' actual' : ''}"><button class="check" type="button" data-marcar="${c}" aria-pressed="${hecho}" aria-label="Proverbios ${c} ${hecho ? 'leído' : 'sin leer'}">${ok}</button>
        <a href="${enlace(c)}"><span class="txt"><span class="n">Día ${c}${actual ? '<span class="chip">Hoy</span>' : ''}</span><span class="t">Proverbios ${c}</span><span class="r">${esc(t)}</span></span>${chev}</a></div>`;
    }).join('');
  }
  document.addEventListener('click', e => {
    const m = e.target.closest('[data-marcar]'); if (!m) return;
    const c = parseInt(m.dataset.marcar, 10), p = leer(), set = new Set(p.hechos.map(Number));
    set.has(c) ? set.delete(c) : set.add(c);
    p.hechos = [...set].sort((a, b) => a - b); guardar(p); pintar();
  });
  document.getElementById('reiniciar').addEventListener('click', () => { if (confirm('¿Desmarcar los 31 capítulos para empezar de nuevo?')) { guardar({ hechos: [] }); pintar(); } });
  pintar();
  // Al entrar, la lectura de hoy brilla un momento
  setTimeout(() => {
    const hoy = document.getElementById('hoy');
    hoy.classList.add('brillo'); setTimeout(() => hoy.classList.remove('brillo'), 2300);
  }, 500);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="../cuenta.js"></script>
</body>
