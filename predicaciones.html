  <header class="pt"><div><h1>Predicaciones</h1><small>Mensajes de la iglesia en video</small></div></header>

  <section aria-labelledby="t-rec" style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h2 class="sec" id="t-rec">Lo más reciente</h2><a href="playlist-detail.html?id=UUh2_5mMqBEFlYdxg81Rys_Q&amp;name=%C3%9Altimas%20predicaciones" style="font-size:14px;font-weight:600;padding:10px 0">Ver todas</a></div>

  </section>

  <section aria-labelledby="t-ser" style="display:flex;flex-direction:column;gap:12px">

    <label class="buscador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Buscar predicador o serie</span><input id="buscar" type="search" placeholder="Buscar predicador o serie" autocomplete="off"></label>
    <div class="series" id="series"><span class="serie"><span class="mini esqueleto"></span></span><span class="serie"><span class="mini esqueleto"></span></span><span class="serie"><span class="mini esqueleto"></span></span><span class="serie"><span class="mini esqueleto"></span></span></div>
  </section>

</div></nav>

<script>
(function () {
  'use strict';

  const KEY = 'AIzaSyA5B2vj3m6lMWRrMrF7LP7xD3PsPVTjBzM', CANAL = 'UCh2_5mMqBEFlYdxg81Rys_Q', SUBIDAS = 'UUh2_5mMqBEFlYdxg81Rys_Q';
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const normal = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const PLAYMINI = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
  function hace(f) {
    const d = Math.floor((Date.now() - new Date(f).getTime()) / 86400000);
    if (d <= 0) return 'Hoy'; if (d === 1) return 'Ayer'; if (d < 7) return `Hace ${d} días`;
    if (d < 30) { const s = Math.floor(d / 7); return s === 1 ? 'Hace 1 semana' : `Hace ${s} semanas`; }
    return new Date(f).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  // Guarda respuestas un tiempo para no gastar la cuota diaria de YouTube
  function deCache(k, horas) { try { const c = JSON.parse(localStorage.getItem(k)); if (c && Date.now() - c.t < horas * 3600000) return c.d; } catch (e) {} return null; }
  function aCache(k, d) { try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), d })); } catch (e) {} }
  async function yt(ruta) {
    const r = await fetch(`https://www.googleapis.com/youtube/v3/${ruta}&key=${KEY}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('YouTube ' + r.status);
    return r.json();
  }
  async function videosDe(lista, max) {
    let todos = [], token = '';
    do {
      const d = await yt(`playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${lista}${token ? '&pageToken=' + token : ''}`);
      todos = todos.concat(d.items || []);
      token = d.nextPageToken || '';
    } while (token && todos.length < (max || 2000));
    return todos.filter(x => !/^(private|deleted) video$/i.test(x.snippet?.title || ''))
      .map(x => ({ id: x.contentDetails?.videoId || x.snippet?.resourceId?.videoId, titulo: x.snippet?.title || '', fecha: x.contentDetails?.videoPublishedAt || x.snippet?.publishedAt }))
      .filter(x => x.id).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  }
  const miniatura = id => `<span class="mini"><img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><span class="play">${PLAYMINI}</span></span>`;

  let series = [];
  function pintarSeries() {
    const q = normal($('buscar').value.trim());
    const lista = series.filter(x => !q || normal(x.titulo).includes(q));
    $('series').innerHTML = lista.length ? lista.map(x => `<a class="serie" href="playlist-detail.html?id=${x.id}&name=${encodeURIComponent(x.titulo)}">
      <span class="mini">${x.img ? `<img src="${x.img}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span class="cant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h13M3 12h13M3 18h9"/><path d="m17 15 4 3-4 3z" fill="currentColor"/></svg>${x.n}</span></span>
      <b>${esc(x.titulo)}</b><span class="meta">${x.n === 1 ? '1 video' : x.n + ' videos'}</span></a>`).join('')
      : `<p class="error" style="grid-column:1/-1">${series.length ? 'No hay series con ese nombre.' : 'Todavía no hay series publicadas.'}</p>`;
  }
  $('buscar').addEventListener('input', pintarSeries);

  (async function recientes() {
    let v = deCache('predicasRecientes8', 2);
    try { if (!v) { v = (await videosDe(SUBIDAS, 50)).slice(0, 8); aCache('predicasRecientes8', v); } }
    catch (e) { $('recientes').innerHTML = '<p class="error" style="flex:1">No se pudieron cargar los videos recientes.</p>'; return; }
    $('recientes').innerHTML = v.map(x => `<a class="rec" href="playlist-detail.html?id=${SUBIDAS}&name=${encodeURIComponent('Últimas predicaciones')}&v=${x.id}">${miniatura(x.id)}<b>${esc(x.titulo)}</b><span class="meta">${hace(x.fecha)}</span></a>`).join('');
  })();

  (async function cargarSeries() {
    let d = deCache('predicasSeries', 6);
    try {
      if (!d) {
        let todos = [], token = '';
        do {
          const r = await yt(`playlists?part=snippet,contentDetails&channelId=${CANAL}&maxResults=50${token ? '&pageToken=' + token : ''}`);
          todos = todos.concat(r.items || []); token = r.nextPageToken || '';
        } while (token && todos.length < 500);
        d = todos.map(p => ({ id: p.id, titulo: p.snippet?.title || '', n: p.contentDetails?.itemCount || 0,
          img: (p.snippet?.thumbnails?.medium || p.snippet?.thumbnails?.high || p.snippet?.thumbnails?.default || {}).url || '' })).filter(p => p.n > 0);
        aCache('predicasSeries', d);
      }
      series = d; pintarSeries();
    } catch (e) { $('series').innerHTML = '<p class="error" style="grid-column:1/-1">No se pudieron cargar las series. Revisa tu conexión e inténtalo más tarde.</p>'; }
  })();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="cuenta.js"></script>
</body>
</html>
