<style>
.au-h { margin: 0; font-size: 26px; font-weight: 700; }
.reproductor { background: var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.portada { width: min(220px, 60vw); aspect-ratio: 1; border-radius: 28px; background: var(--accent-soft); display: grid; place-items: center; position: relative; overflow: hidden; }
.portada img { width: 72%; height: 72%; object-fit: contain; border-radius: 50%; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.12); transition: transform .6s ease; }
.sonando .portada img { animation: girar 24s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.ondas { position: absolute; inset: 0; border-radius: 28px; pointer-events: none; }
.sonando .ondas { animation: latir 2.4s ease-in-out infinite; }
@keyframes latir { 50% { box-shadow: inset 0 0 0 6px var(--accent-fill); opacity: .35; } }
.titulo-cap { text-align: center; }
.titulo-cap b { display: block; font-size: 24px; }
.titulo-cap span { color: var(--text-2); font-size: 14px; }
.elegir { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
.avance { width: 100%; }
.avance input { width: 100%; accent-color: var(--accent-fill); height: 28px; }
.tiempos { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.controles { display: flex; align-items: center; justify-content: center; gap: 10px; }
.ctl { width: 52px; height: 52px; border-radius: 26px; border: 0; background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; position: relative; }
.ctl small { position: absolute; font-size: 9px; font-weight: 800; bottom: 13px; }
.ctl.grande { width: 76px; height: 76px; border-radius: 38px; background: var(--accent-fill); color: var(--on-accent); box-shadow: 0 6px 18px rgba(46,125,50,.3); transition: transform .15s; }
.ctl.grande:active { transform: scale(.94); }
.ctl:disabled { opacity: .35; cursor: default; }
.extras { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.nota-fondo { font-size: 13px; color: var(--text-2); text-align: center; margin: 0; }
.velo { position: fixed; inset: 0; z-index: 60; background: rgba(15,20,18,.42); opacity: 0; pointer-events: none; transition: opacity .3s; }
.velo.on { opacity: 1; pointer-events: auto; }
.hoja { position: fixed; z-index: 70; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px; max-height: 86vh; overflow: auto; background: var(--surface); color: var(--text);
  border-radius: 24px 24px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(0,0,0,.16);
  transform: translateY(105%); visibility: hidden; transition: transform .38s cubic-bezier(.2,.9,.25,1.06); }
.hoja.on { transform: none; visibility: visible; }
.grip { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 14px; }
.hoja-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.hoja-top h2 { margin: 0; font-size: 18px; }
.cerrar { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--bg); color: var(--text); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.buscador { display: flex; align-items: center; gap: 8px; height: 46px; border-radius: 23px; border: 1px solid var(--border); background: var(--bg); padding: 0 14px; color: var(--text-2); margin-bottom: 10px; }
.buscador input { flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; outline: none; }
.seg2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg); border: 1px solid var(--border); margin-bottom: 8px; }
.seg2 button { height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.libro { border-bottom: 1px solid var(--border); }
.libro > button { width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; border: 0; background: none; color: var(--text); font: inherit; font-size: 16px; cursor: pointer; padding: 0 2px; }
.libro.abierto > button { color: var(--accent); font-weight: 700; }
.caps { display: none; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 2px 0 14px; }
.libro.abierto .caps { display: grid; }
.caps button { height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
.caps button.on { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.opciones { display: flex; flex-direction: column; }
.opciones button { min-height: 52px; border: 0; border-bottom: 1px solid var(--border); background: none; color: var(--text); font: inherit; font-size: 16px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.opciones button[aria-checked="true"] { color: var(--accent); font-weight: 700; }
.aviso { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 90; background: var(--text); color: var(--surface);
  padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 90vw; text-align: center; }
.aviso.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .sonando .portada img, .sonando .ondas { animation: none; } .hoja, .velo { transition: none; } }
</style>
</head>
<body>
<main class="page">
  <h1 class="au-h">Escuchar la Biblia</h1>

  <section class="reproductor" id="repro" aria-label="Reproductor">
    <div class="portada"><img src="icons/icon-512.png" alt="" onerror="this.src='icons/pymicon.png'"><span class="ondas"></span></div>
    <div class="titulo-cap"><b id="ahora">Elige un capítulo</b><span id="ahora-sub">Biblia en audio</span></div>
    <button class="elegir" type="button" id="btn-elegir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/></svg><span>Elegir libro y capítulo</span></button>
    <div class="avance">
      <label for="barra" class="sr">Posición del audio</label>
      <input type="range" id="barra" min="0" max="100" step="1" value="0" disabled>
      <div class="tiempos"><span id="t-actual">0:00</span><span id="t-total">0:00</span></div>
    </div>
    <div class="controles">
      <button class="ctl" type="button" id="b-ant" aria-label="Capítulo anterior"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 20 9 12l10-8z" fill="currentColor"/><path d="M5 19V5"/></svg></button>
      <button class="ctl" type="button" id="b-menos" aria-label="Retroceder 15 segundos"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><small>15</small></button>
      <button class="ctl grande" type="button" id="b-play" aria-label="Reproducir"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16l13-8z" fill="currentColor"/></svg></button>
      <button class="ctl" type="button" id="b-mas" aria-label="Adelantar 15 segundos"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><small>15</small></button>
      <button class="ctl" type="button" id="b-sig" aria-label="Capítulo siguiente"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 10 8-10 8z" fill="currentColor"/><path d="M19 5v14"/></svg></button>
    </div>
    <div class="extras">
      <button class="chip" type="button" id="b-vel" aria-label="Velocidad">1x</button>
      <button class="chip" type="button" id="b-dormir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="txt-dormir">Temporizador</span></button>
      <a class="chip" id="b-leer" href="lectura.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>Leer este capítulo</a>
    </div>
    <p class="nota-fondo">Sigue sonando con la pantalla apagada, y puedes pausar o cambiar de capítulo desde la pantalla de bloqueo.</p>
  </section>
  <audio id="audio" preload="metadata" playsinline></audio>
</main>

<nav class="tabbar" aria-label="Navegación principal"><div class="in">
  <a href="index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>

  <a href="planes-estudio.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg>Planes</a>
  <a href="predicaciones.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>Prédicas</a>
  <a href="mas.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Más</a>
</div></nav>

<div class="velo" id="velo"></div>
<section class="hoja" id="hoja-libros" role="dialog" aria-modal="true" aria-labelledby="hl-t">
  <div class="grip"></div>
  <div class="hoja-top"><h2 id="hl-t">Elegir capítulo</h2><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <label class="buscador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Buscar un libro</span><input id="filtro" type="search" placeholder="Buscar un libro" autocomplete="off"></label>
  <div class="seg2" role="group" aria-label="Testamento"><button type="button" data-test="AT">Antiguo Testamento</button><button type="button" data-test="NT">Nuevo Testamento</button></div>
  <div id="lista-libros"></div>
</section>
<section class="hoja" id="hoja-dormir" role="dialog" aria-modal="true" aria-labelledby="hd-t">
  <div class="grip"></div>
  <div class="hoja-top"><h2 id="hd-t">Apagar automáticamente</h2><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="opciones" role="radiogroup" aria-labelledby="hd-t">
    <button type="button" role="radio" data-dormir="0">Desactivado</button>
    <button type="button" role="radio" data-dormir="fin">Al terminar el capítulo</button>
    <button type="button" role="radio" data-dormir="15">En 15 minutos</button>
    <button type="button" role="radio" data-dormir="30">En 30 minutos</button>
    <button type="button" role="radio" data-dormir="60">En 1 hora</button>
  </div>
</section>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  const LIBROS = ["Génesis", "Éxodo", "Levítico", "Números", "Deuteronomio", "Josué", "Jueces", "Rut", "1 Samuel", "2 Samuel", "1 Reyes", "2 Reyes", "1 Crónicas", "2 Crónicas", "Esdras", "Nehemías", "Ester", "Job", "Salmos", "Proverbios", "Eclesiastés", "Cantares", "Isaías", "Jeremías", "Lamentaciones", "Ezequiel", "Daniel", "Oseas", "Joel", "Amós", "Abdías", "Jonás", "Miqueas", "Nahum", "Habacuc", "Sofonías", "Hageo", "Zacarías", "Malaquías", "Mateo", "Marcos", "Lucas", "Juan", "Hechos", "Romanos", "1 Corintios", "2 Corintios", "Gálatas", "Efesios", "Filipenses", "Colosenses", "1 Tesalonicenses", "2 Tesalonicenses", "1 Timoteo", "2 Timoteo", "Tito", "Filemón", "Hebreos", "Santiago", "1 Pedro", "2 Pedro", "1 Juan", "2 Juan", "3 Juan", "Judas", "Apocalipsis"];
  const CODIGOS = ["genesis", "exodus", "lev", "num", "deu", "joshua", "judges", "ruth", "1sam", "2sam", "1kin", "2kin", "1chron", "2chron", "ezra", "nehemiah", "esther", "job", "psalm", "proverbs", "ecc", "song", "isaiah", "jere", "lam", "ezek", "dan", "hosea", "joel", "amos", "oba", "jonah", "micah", "nahum", "habak", "haggai", "zeph", "zech", "mal", "matt", "mark", "luke", "john", "acts", "romans", "1cor", "2cor", "gal", "eph", "phil", "col", "1the", "2the", "1tim", "2tim", "tit", "phi", "heb", "jam", "1pet", "2pet", "1joh", "2joh", "3joh", "jude", "rev"];
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  const ICO_PLAY = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>', ICO_PAUSA = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></svg>', OK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  const leer = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = s => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
  let tAviso; const avisar = t => { const a = $('aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('on'), 2400); };

  let caps = {};          // código -> número de capítulos con audio
  let actual = null;       // { i: índice del libro, c: capítulo }
  const archivo = (i, c) => `${CODIGOS[i]}_${String(c).padStart(CODIGOS[i] === 'psalm' && c >= 100 ? 3 : 2, '0')}.mp3`;
  let archivos = new Set();

  function cargar(i, c, opc = {}) {
    actual = { i, c };
    const f = archivo(i, c);
    audio.src = `audio/${f}`;
    $('ahora').textContent = `${LIBROS[i]} ${c}`;
    $('ahora-sub').textContent = `Capítulo ${c} de ${caps[CODIGOS[i]] || '?'}`;
    $('b-leer').href = `lectura.html?book=${encodeURIComponent(LIBROS[i])}&chapter=${c}`;
    $('barra').disabled = false;
    guardar('audio-last-book', CODIGOS[i]); guardar('audio-last-file', f);
    if (!opc.mantener) guardar('audio-last-position', '0');
    $('b-ant').disabled = !vecino(-1); $('b-sig').disabled = !vecino(1);
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `${LIBROS[i]} ${c}`, artist: 'Biblia de Poder y Milagros', album: 'Biblia en audio',
        artwork: [{ src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }, { src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png' }]
      });
    }
    if (opc.posicion) audio.addEventListener('loadedmetadata', () => { audio.currentTime = opc.posicion; }, { once: true });
    if (opc.reproducir) audio.play().catch(() => {});
  }
  function vecino(dir) {
    if (!actual) return null;
    let i = actual.i, c = actual.c + dir;
    if (c < 1) { if (i === 0) return null; i--; c = caps[CODIGOS[i]]; }
    else if (c > caps[CODIGOS[i]]) { if (i === CODIGOS.length - 1) return null; i++; c = 1; }
    return { i, c };
  }
  function ir(dir) { const n = vecino(dir); if (n) cargar(n.i, n.c, { reproducir: true }); }

  // Controles
  $('b-play').addEventListener('click', () => {
    if (!actual) { abrirLibros(); return; }
    audio.paused ? audio.play().catch(() => avisar('No se pudo reproducir. Revisa tu conexión.')) : audio.pause();
  });
  $('b-ant').addEventListener('click', () => ir(-1));
  $('b-sig').addEventListener('click', () => ir(1));
  $('b-menos').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
  $('b-mas').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15); });
  $('barra').addEventListener('input', () => { audio.currentTime = parseFloat($('barra').value); });
  const VEL = [1, 1.25, 1.5, 0.75];
  let vel = parseFloat(leer('audio-velocidad', '1')); if (!VEL.includes(vel)) vel = 1;
  function aplicarVel() { audio.playbackRate = vel; $('b-vel').textContent = (vel === 1 ? '1' : String(vel).replace('.', ',')) + 'x'; $('b-vel').classList.toggle('on', vel !== 1); }
  $('b-vel').addEventListener('click', () => { vel = VEL[(VEL.indexOf(vel) + 1) % VEL.length]; guardar('audio-velocidad', String(vel)); aplicarVel(); avisar(`Velocidad ${$('b-vel').textContent}`); });
  audio.addEventListener('loadedmetadata', aplicarVel);

  audio.addEventListener('play', () => { $('b-play').innerHTML = ICO_PAUSA; $('b-play').setAttribute('aria-label', 'Pausar'); $('repro').classList.add('sonando'); });
  audio.addEventListener('pause', () => { $('b-play').innerHTML = ICO_PLAY; $('b-play').setAttribute('aria-label', 'Reproducir'); $('repro').classList.remove('sonando'); });
  audio.addEventListener('loadedmetadata', () => { $('barra').max = Math.floor(audio.duration) || 100; $('t-total').textContent = fmt(audio.duration); });
  let ultimoGuardado = 0;
  audio.addEventListener('timeupdate', () => {
    $('barra').value = audio.currentTime; $('t-actual').textContent = fmt(audio.currentTime);
    if (Date.now() - ultimoGuardado > 4000) { ultimoGuardado = Date.now(); guardar('audio-last-position', String(audio.currentTime)); }
    if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && isFinite(audio.duration)) {
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime }); } catch (e) {}
    }
  });
  audio.addEventListener('ended', () => {
    if (dormir === 'fin') { ponerDormir('0'); avisar('Temporizador: se detuvo al terminar el capítulo'); return; }
    ir(1);
  });
  audio.addEventListener('error', () => { if (audio.src) avisar('No se pudo cargar este audio. Revisa tu conexión.'); });

  // Pantalla de bloqueo y audífonos
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession, h = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
    h('play', () => audio.play()); h('pause', () => audio.pause());
    h('previoustrack', () => ir(-1)); h('nexttrack', () => ir(1));
    h('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 15)); });
    h('seekforward', d => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 15)); });
    h('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  }

  // Temporizador para dormir
  let dormir = '0', tDormir = null;
  function ponerDormir(v) {
    dormir = v; clearTimeout(tDormir);
    if (/^\d+$/.test(v) && v !== '0') tDormir = setTimeout(() => { audio.pause(); ponerDormir('0'); avisar('Temporizador: audio detenido'); }, parseInt(v, 10) * 60000);
    $('txt-dormir').textContent = v === '0' ? 'Temporizador' : v === 'fin' ? 'Al terminar' : `${v} min`;
    $('b-dormir').classList.toggle('on', v !== '0');
    document.querySelectorAll('[data-dormir]').forEach(b => { b.setAttribute('aria-checked', String(b.dataset.dormir === v)); b.innerHTML = b.textContent.replace(/\s*$/, '') + (b.dataset.dormir === v ? OK : ''); });
  }
  $('b-dormir').addEventListener('click', () => abrir('hoja-dormir'));
  document.querySelectorAll('[data-dormir]').forEach(b => b.addEventListener('click', () => { ponerDormir(b.dataset.dormir); cerrar(); }));

  // Hojas
  let abierta = null;
  function abrir(id) { const el = $(id); abierta = el; $('velo').classList.add('on'); requestAnimationFrame(() => { if (abierta === el) el.classList.add('on'); }); }
  function cerrar() { if (abierta) abierta.classList.remove('on'); $('velo').classList.remove('on'); abierta = null; }
  $('velo').addEventListener('click', cerrar);
  document.addEventListener('click', e => { if (e.target.closest('[data-cerrar]')) cerrar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });

  // Elegir libro y capítulo
  let testamento = 'NT';
  const normal = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  function pintarLibros() {
    const f = normal($('filtro').value.trim());
    const lista = LIBROS.map((b, i) => ({ b, i })).filter(({ b, i }) => caps[CODIGOS[i]] && (f ? normal(b).includes(f) : (testamento === 'AT' ? i < 39 : i >= 39)));
    $('lista-libros').innerHTML = lista.map(({ b, i }) => {
      const ab = (actual && actual.i === i) || lista.length === 1, n = caps[CODIGOS[i]];
      let cs = ''; for (let c = 1; c <= n; c++) cs += `<button type="button" data-i="${i}" data-c="${c}"${actual && actual.i === i && actual.c === c ? ' class="on" aria-current="true"' : ''}>${c}</button>`;
      return `<div class="libro${ab ? ' abierto' : ''}"><button type="button" aria-expanded="${ab}">${esc(b)}<small style="color:var(--text-2);font-weight:500">${n} cap.</small></button><div class="caps">${cs}</div></div>`;
    }).join('') || '<p style="color:var(--text-2)">No hay libros con ese nombre.</p>';
    document.querySelectorAll('[data-test]').forEach(x => x.setAttribute('aria-pressed', String(!f && x.dataset.test === testamento)));
  }
  function abrirLibros() { testamento = actual && actual.i < 39 ? 'AT' : 'NT'; $('filtro').value = ''; pintarLibros(); abrir('hoja-libros'); }
  $('btn-elegir').addEventListener('click', abrirLibros);
  $('filtro').addEventListener('input', pintarLibros);
  document.querySelectorAll('[data-test]').forEach(b => b.addEventListener('click', () => { testamento = b.dataset.test; $('filtro').value = ''; pintarLibros(); }));
  $('lista-libros').addEventListener('click', e => {
    const cap = e.target.closest('[data-c]');
    if (cap) { cerrar(); cargar(parseInt(cap.dataset.i, 10), parseInt(cap.dataset.c, 10), { reproducir: true }); return; }
    const cab = e.target.closest('.libro > button');
    if (cab) { const d = cab.parentElement, ab = !d.classList.contains('abierto'); document.querySelectorAll('#lista-libros .libro.abierto').forEach(x => x.classList.remove('abierto')); if (ab) d.classList.add('abierto'); }
  });

  // Inicio: cargar la lista de audios y retomar donde se quedó
  aplicarVel();
  ponerDormir('0');
  fetch('audio/manifest.json').then(r => r.json()).then(m => {
    m.forEach(x => { caps[x.name] = (caps[x.name] || 0) + 1; archivos.add(x.file); });
    const params = new URLSearchParams(location.search);
    const pb = params.get('book');
    if (pb) {
      const i = LIBROS.findIndex(b => normal(b) === normal(pb));
      if (i >= 0) {
        cargar(i, parseInt(params.get('chapter') || '1', 10) || 1);
        if (params.get('play') === '1') audio.play().catch(() => { $('ahora-sub').textContent = 'Toca ▶ para empezar a escuchar'; $('b-play').focus(); });
        return;
      }
    }
    const lb = leer('audio-last-book', ''), lf = leer('audio-last-file', '');
    const i = CODIGOS.indexOf(lb), mm = lf.match(/_(\d+)\.mp3$/);
    if (i >= 0 && mm) {
      const pos = parseFloat(leer('audio-last-position', '0')) || 0;
      cargar(i, parseInt(mm[1], 10), { mantener: true, posicion: pos });
      if (pos > 5) $('ahora-sub').textContent = `Continúa en ${fmt(pos)}`;
    }
  }).catch(() => avisar('No se pudo cargar la lista de audios'));

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="cuenta.js"></script>
