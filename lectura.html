<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8F5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/pymicon.png">
<link rel="apple-touch-icon" href="icons/pymicon.png">
<meta name="application-name" content="BibliaPYM">
<meta name="apple-mobile-web-app-title" content="BibliaPYM">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="tema.js"></script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="lectura.css">
<title>Leer la Biblia · Biblia de Poder y Milagros</title>
</head>
<body class="lectura">

<header class="lbar" id="barra">
  <div class="in">
    <button class="lpill" id="btn-pasaje" type="button" aria-label="Elegir libro y capítulo"><span id="txt-pasaje">Cargando…</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="lpill ver" id="btn-version" type="button" aria-label="Cambiar versión"><span id="txt-version">RVR1960</span></button>
    <span style="flex:1;min-width:0"></span>
    <button class="lib" id="btn-notas" type="button" aria-label="Mis notas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <button class="lib" id="btn-buscar" type="button" aria-label="Buscar en la Biblia"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="lib" id="btn-aa" type="button" aria-label="Ajustes de lectura">Aa</button>
  </div>
</header>

<main class="lector" id="lector">
  <h1 class="cap-t" id="cap-t"><small id="cap-ver"></small><span id="cap-nombre"></span></h1>
  <div class="texto" id="texto"><div class="cargando-txt">Cargando la Biblia…</div></div>
  <nav class="fin" id="fin" aria-label="Cambiar de capítulo"></nav>
</main>

<button class="fab ant" id="fab-ant" type="button" aria-label="Capítulo anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
<button class="fab sig" id="fab-sig" type="button" aria-label="Capítulo siguiente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>

<button class="escuchar-pill" id="btn-escuchar" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg><span>Escuchar capítulo</span></button>
<div class="mini" id="mini" hidden role="region" aria-label="Audio del capítulo">
  <button class="mini-b" id="mini-play" type="button" aria-label="Pausar"></button>
  <div class="mini-t"><b id="mini-tit"></b><span class="mini-barra"><i id="mini-prog"></i></span></div>
  <a class="mini-b" id="mini-mas" href="audio.html" aria-label="Abrir el reproductor completo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
  <button class="mini-b" id="mini-cerrar" type="button" aria-label="Dejar de escuchar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<audio id="mini-audio" preload="none" playsinline></audio>

<nav class="tabbar" aria-label="Navegación principal"><div class="in">
  <a href="index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="lectura.html" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/><path d="M12 6v8M9 9h6"/></svg>Biblia</a>
  <a href="planes-estudio.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg>Planes</a>
  <a href="predicaciones.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>Prédicas</a>
  <a href="mas.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Más</a>
</div></nav>

<div class="velo" id="velo"></div>

<!-- Acciones del versículo -->
<section class="hoja" id="hoja-v" role="dialog" aria-modal="true" aria-labelledby="hv-ref">
  <div class="grip"></div>
  <div class="hoja-top"><div><h2 id="hv-ref"></h2><small id="hv-ver"></small></div><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="colores" role="group" aria-label="Marcar con color">
    <button class="color" type="button" data-color="amarillo" style="background:var(--hl-amarillo)" aria-label="Marcar en amarillo"></button>
    <button class="color" type="button" data-color="verde" style="background:var(--hl-verde)" aria-label="Marcar en verde"></button>
    <button class="color" type="button" data-color="azul" style="background:var(--hl-azul)" aria-label="Marcar en azul"></button>
    <button class="color" type="button" data-color="rosa" style="background:var(--hl-rosa)" aria-label="Marcar en rosa"></button>
    <button class="color" type="button" data-color="morado" style="background:var(--hl-morado)" aria-label="Marcar en morado"></button>
    <button class="color quitar" type="button" data-color="" aria-label="Quitar marca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="acciones">
    <button class="accion" type="button" data-accion="comparar" style="transition-delay:.05s"><span class="c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></span>Comparar</button>
    <button class="accion" type="button" data-accion="comentar" style="transition-delay:.08s"><span class="c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span id="txt-comentar">Comentar</span></button>
    <button class="accion" type="button" data-accion="memorizar" style="transition-delay:.11s"><span class="c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg></span><span id="txt-memorizar">Memorizar</span></button>
    <button class="accion" type="button" data-accion="copiar" style="transition-delay:.14s"><span class="c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span>Copiar</button>
    <button class="accion" type="button" data-accion="compartir" style="transition-delay:.17s"><span class="c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></span>Compartir imagen</button>
    <button class="accion" type="button" data-accion="nota" style="transition-delay:.2s"><span class="c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>Agregar a nota</button>
  </div>
</section>

<!-- Comentario -->
<section class="hoja" id="hoja-com" role="dialog" aria-modal="true" aria-labelledby="hc-ref">
  <div class="grip"></div>
  <div class="hoja-top"><div><h2 id="hc-ref"></h2><small>Tu comentario sobre este versículo</small></div><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <label for="hc-txt" class="sr">Comentario</label>
  <textarea id="hc-txt" class="area" placeholder="Escribe tu comentario…"></textarea>
  <div style="display:flex;gap:10px;margin-top:12px"><button class="btn-l" id="hc-guardar" type="button" style="flex:1">Guardar</button><button class="btn-l peligro" id="hc-borrar" type="button">Eliminar</button></div>
</section>

<!-- Comparar un versículo -->
<section class="hoja" id="hoja-cmp" role="dialog" aria-modal="true" aria-labelledby="hcmp-ref">
  <div class="grip"></div>
  <div class="hoja-top"><div><h2 id="hcmp-ref"></h2><small>Elige otra versión para compararlo</small></div><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="lista-v" id="hcmp-lista"></div>
  <div class="cmp-res" id="hcmp-res" hidden></div>
</section>

<!-- Versión -->
<section class="hoja" id="hoja-ver" role="dialog" aria-modal="true" aria-labelledby="hver-t">
  <div class="grip"></div>
  <div class="hoja-top"><h2 id="hver-t">Versión de la Biblia</h2><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="lista-v" id="hver-lista"></div>
</section>

<!-- Ajustes de lectura -->
<section class="hoja" id="hoja-aa" role="dialog" aria-modal="true" aria-labelledby="haa-t">
  <div class="grip"></div>
  <div class="hoja-top"><h2 id="haa-t">Ajustes de lectura</h2><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="fila"><span>Tamaño de letra</span><span style="display:flex;align-items:center;gap:8px"><button class="s" type="button" id="aa-menos" aria-label="Letra más pequeña">A−</button><b id="aa-tam" style="min-width:34px;text-align:center">20</b><button class="s" type="button" id="aa-mas" aria-label="Letra más grande" style="font-size:19px">A+</button></span></div>
  <div style="padding:14px 0 8px;font-size:16px">Tema</div>
  <div class="seg" role="group" aria-label="Tema" style="margin:0 0 6px"><button type="button" data-tema="claro">Claro</button><button type="button" data-tema="oscuro">Oscuro</button><button type="button" data-tema="auto">Automático</button></div>
  <div class="fila"><label for="aa-cmp">Comparar con otra versión</label><select id="aa-cmp" class="selector"></select></div>
  <div class="fila"><span id="aa-peri-l">Títulos de perícopas</span><button class="interruptor" id="aa-peri" type="button" role="switch" aria-labelledby="aa-peri-l"></button></div>
  <div class="fila"><span>Perícopas de este libro</span><button class="btn-l sec" type="button" id="aa-ver-peri" style="min-height:40px;font-size:14px">Ver lista</button></div>
</section>

<!-- Elegir pasaje -->
<section class="pantalla" id="p-pasaje" role="dialog" aria-modal="true" aria-labelledby="pp-t">
  <div class="p-top"><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h2 id="pp-t">Elegir pasaje</h2><span style="width:44px"></span></div>
  <div class="p-body">
    <label class="buscador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Buscar un libro</span><input id="pp-filtro" type="search" placeholder="Buscar un libro" autocomplete="off"></label>
    <div class="seg2" role="group" aria-label="Testamento"><button type="button" data-test="AT">Antiguo Testamento</button><button type="button" data-test="NT">Nuevo Testamento</button></div>
    <div id="pp-libros"></div>
  </div>
</section>

<!-- Buscar -->
<section class="pantalla" id="p-buscar" role="dialog" aria-modal="true" aria-labelledby="pb-t">
  <div class="p-top"><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h2 id="pb-t">Buscar en la Biblia</h2><span style="width:44px"></span></div>
  <div class="p-body">
    <form id="pb-form" class="buscador" role="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label for="pb-q" class="sr">Palabra o frase</label><input id="pb-q" type="search" placeholder="Palabra o frase, por ejemplo: no temas" autocomplete="off" minlength="2" required><button class="btn-l" type="submit" style="min-height:36px;padding:0 14px;font-size:14px">Buscar</button></form>
    <div class="seg2" role="group" aria-label="Tipo de búsqueda" style="margin-bottom:4px"><button type="button" data-modo="exacta">Palabra exacta</button><button type="button" data-modo="contiene">Contiene las letras</button></div>
    <p class="res-n" id="pb-ayuda" style="margin-top:6px"></p>
    <div id="pb-res"></div>
  </div>
</section>

<!-- Perícopas del libro -->
<section class="pantalla" id="p-peri" role="dialog" aria-modal="true" aria-labelledby="ppe-t">
  <div class="p-top"><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h2 id="ppe-t">Perícopas</h2><span style="width:44px"></span></div>
  <div class="p-body" id="ppe-lista"></div>
</section>

<!-- Notas -->
<section class="pantalla" id="p-notas" role="dialog" aria-modal="true" aria-labelledby="pn-t">
  <div class="p-top"><button class="cerrar" type="button" data-cerrar aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h2 id="pn-t">Mis notas</h2><button class="cerrar" type="button" id="pn-pdf" aria-label="Descargar en PDF" style="background:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button></div>
  <div class="p-body">
    <div class="seg2" role="group" aria-label="Notas"><button type="button" data-ntab="editar" aria-pressed="true">Nota rápida</button><button type="button" data-ntab="todas" id="pn-tab-todas">Todas mis notas</button></div>
    <div id="pn-editar">
      <label for="pn-tit" class="sr">Título de la nota</label>
      <input id="pn-tit" class="n-tit" placeholder="Título de la nota">
      <div class="n-tools" role="toolbar" aria-label="Formato">
        <button type="button" data-cmd="bold" aria-label="Negrita"><b>B</b></button>
        <button type="button" data-cmd="italic" aria-label="Cursiva"><i style="font-family:Georgia,serif">I</i></button>
        <button type="button" data-cmd="underline" aria-label="Subrayado"><u>U</u></button>
        <span class="sep"></span>
        <button type="button" data-cmd="insertUnorderedList" aria-label="Lista con viñetas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
        <button type="button" data-cmd="insertOrderedList" aria-label="Lista numerada"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
        <button type="button" id="pn-img-btn" aria-label="Agregar imagen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
        <input type="file" id="pn-img" accept="image/*" hidden>
      </div>
      <div id="pn-editor" class="n-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Contenido de la nota" data-ph="Escribe aquí tu reflexión, apuntes de la predicación o estudio…"></div>
      <div class="n-pie"><button class="btn-l" id="pn-guardar" type="button">Guardar nota</button><button class="btn-l sec" id="pn-nueva" type="button">Nueva</button></div>
    </div>
    <div id="pn-todas" hidden></div>
  </div>
</section>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="pericopas-datos-completo.js"></script>
<script src="audio-biblia.js"></script>
<script src="lectura.js"></script>
<script type="module" src="cuenta.js"></script>
</body>
</html>
