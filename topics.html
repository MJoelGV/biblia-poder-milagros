<main class="page">
  <header class="pt"><a class="atras" href="mas.html" aria-label="Volver a Más"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a><div><h1>Temas</h1><small id="sub">Versículos para cada momento</small></div></header>
  <label class="buscador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Buscar un tema</span><input id="q" type="search" placeholder="Buscar un tema o palabra, por ejemplo: paz" autocomplete="off"></label>
  <div class="lista" id="lista"><p class="vacio">Cargando los temas…</p></div>

<nav class="tabbar" aria-label="Navegación principal"><div class="in">

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const normal = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const CHEV = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>', HP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>', LEER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>', SHARE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>';
  const leer = (b, c, v) => `lectura.html?book=${encodeURIComponent(b)}&chapter=${c}${v ? '&verse=' + v : ''}`;
  const oir = (b, c) => `audio.html?book=${encodeURIComponent(b)}&chapter=${c}&play=1`;
  const compartir = (b, c, v) => `share.html?book=${encodeURIComponent(b)}&chapter=${c}&verse=${v}`;
  function alternar(e) { const cab = e.target.closest('.cab'); if (!cab) return false; const t = cab.parentElement, ab = !t.classList.contains('abierta'); t.classList.toggle('abierta', ab); cab.setAttribute('aria-expanded', String(ab)); return true; }


  let temas = [];
  function pintar() {
    const q = normal($('q').value.trim());
    const lista = temas.map(t => {
      if (!q || normal(t.n).includes(q)) return t;
      const subs = t.subs.map(s => normal(s.n).includes(q) ? s : { ...s, refs: s.refs.filter(r => normal(r.t + ' ' + r.b).includes(q)) }).filter(s => s.refs.length);
      return subs.length ? { ...t, subs, abierto: true } : null;
    }).filter(Boolean);
    $('sub').textContent = `${temas.length} temas con versículos para cada momento`;
    $('lista').innerHTML = lista.map(t => {
      const n = t.subs.reduce((a, s) => a + s.refs.length, 0);
      return `<article class="tarjeta${t.abierto ? ' abierta' : ''}"><button class="cab" type="button" aria-expanded="${!!t.abierto}"><span class="tx"><b>${esc(t.n)}</b><span>${t.subs.map(s => esc(s.n)).join(' · ')} · ${n} ${n === 1 ? 'versículo' : 'versículos'}</span></span>${CHEV}</button>
        <div class="cuerpo">${t.subs.map(s => `<h3 class="sub-t">${esc(s.n)}</h3><div class="vers">${s.refs.map(r => {
          const v1 = String(r.v).split('-')[0];
          return `<div class="ver"><p>${esc(r.t)}</p><div class="r"><b>${esc(r.b)} ${esc(r.c)}:${esc(r.v)}</b><a class="mini-a" href="${leer(r.b, r.c, v1)}">${LEER}Leer</a><a class="mini-a" href="${compartir(r.b, r.c, v1)}">${SHARE}Compartir</a></div></div>`;
        }).join('')}</div>`).join('')}</div></article>`;
    }).join('') || '<p class="vacio">No hay temas con esa búsqueda.</p>';
  }
  $('q').addEventListener('input', pintar);
  $('lista').addEventListener('click', alternar);
  fetch('biblia-files/temas-versiculos.xml').then(r => r.text()).then(t => {
    const d = new DOMParser().parseFromString(t, 'text/xml');
    temas = Array.from(d.getElementsByTagName('tema')).map(te => ({ n: te.getAttribute('nombre'), subs: Array.from(te.getElementsByTagName('subtema')).map(s => ({ n: s.getAttribute('nombre'), refs: Array.from(s.getElementsByTagName('referencia')).map(r => ({ b: r.getAttribute('libro'), c: r.getAttribute('capitulo'), v: r.getAttribute('versiculo'), t: r.getAttribute('texto') || '' })) })) }));
    pintar();
  }).catch(() => { $('lista').innerHTML = '<p class="vacio">No se pudieron cargar los temas.</p>'; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="cuenta.js"></script>
</body>
</html>
