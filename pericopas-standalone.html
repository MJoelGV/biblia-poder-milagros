<body>
<main class="page">
  <header class="pt"><a class="atras" href="mas.html" aria-label="Volver a Más"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a><div><h1>Perícopas</h1><small id="sub">Las secciones de cada libro</small></div></header>
  <label class="buscador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Buscar en toda la Biblia</span><input id="q" type="search" placeholder="Buscar un pasaje, por ejemplo: sembrador" autocomplete="off"></label>
  <div class="chips" role="group" aria-label="Testamento"><button class="chip" type="button" data-t="AT">Antiguo Testamento</button><button class="chip" type="button" data-t="NT" aria-pressed="true">Nuevo Testamento</button></div>
  <div class="chips" id="libros" role="group" aria-label="Libro"></div>
  <div id="lista"></div>
  <button class="btn sec mas-btn" type="button" id="mas" hidden>Mostrar más</button>
</main>

<nav class="tabbar" aria-label="Navegación principal"><div class="in">
  <a href="index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="lectura.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/><path d="M12 6v8M9 9h6"/></svg>Biblia</a>
  <a href="planes-estudio.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg>Planes</a>
  <a href="predicaciones.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>Prédicas</a>
  <a href="mas.html" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Más</a>
</div></nav>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const normal = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const CHEV = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>', HP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>', LEER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>', SHARE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>';
  const leer = (b, c, v) => `lectura.html?book=${encodeURIComponent(b)}&chapter=${c}${v ? '&verse=' + v : ''}`;
  const oir = (b, c) => `audio.html?book=${encodeURIComponent(b)}&chapter=${c}&play=1`;
  const compartir = (b, c, v) => `share.html?book=${encodeURIComponent(b)}&chapter=${c}&verse=${v}`;
  function alternar(e) { const cab = e.target.closest('.cab'); if (!cab) return false; const t = cab.parentElement, ab = !t.classList.contains('abierta'); t.classList.toggle('abierta', ab); cab.setAttribute('aria-expanded', String(ab)); return true; }


  const LIBROS = ["Génesis", "Éxodo", "Levítico", "Números", "Deuteronomio", "Josué", "Jueces", "Rut", "1 Samuel", "2 Samuel", "1 Reyes", "2 Reyes", "1 Crónicas", "2 Crónicas", "Esdras", "Nehemías", "Ester", "Job", "Salmos", "Proverbios", "Eclesiastés", "Cantares", "Isaías", "Jeremías", "Lamentaciones", "Ezequiel", "Daniel", "Oseas", "Joel", "Amós", "Abdías", "Jonás", "Miqueas", "Nahum", "Habacuc", "Sofonías", "Hageo", "Zacarías", "Malaquías", "Mateo", "Marcos", "Lucas", "Juan", "Hechos", "Romanos", "1 Corintios", "2 Corintios", "Gálatas", "Efesios", "Filipenses", "Colosenses", "1 Tesalonicenses", "2 Tesalonicenses", "1 Timoteo", "2 Timoteo", "Tito", "Filemón", "Hebreos", "Santiago", "1 Pedro", "2 Pedro", "1 Juan", "2 Juan", "3 Juan", "Judas", "Apocalipsis"];
  const COD = ["GEN", "EXO", "LEV", "NUM", "DEU", "JOS", "JDG", "RUT", "1SA", "2SA", "1KI", "2KI", "1CH", "2CH", "EZR", "NEH", "EST", "JOB", "PSA", "PRO", "ECC", "SNG", "ISA", "JER", "LAM", "EZK", "DAN", "HOS", "JOL", "AMO", "OBA", "JON", "MIC", "NAM", "HAB", "ZEP", "HAG", "ZEC", "MAL", "MAT", "MRK", "LUK", "JHN", "ACT", "ROM", "1CO", "2CO", "GAL", "EPH", "PHP", "COL", "1TH", "2TH", "1TI", "2TI", "TIT", "PHM", "HEB", "JAS", "1PE", "2PE", "1JN", "2JN", "3JN", "JUD", "REV"];
  const D = window.PERICOPES_DATA || {};
  const cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);
  const de = (i, c) => (D[`${COD[i]}-${c}`] || []).map(p => ({ c, v: parseInt(p.startVerseId, 10) || 1, t: cap1((p.title || '').trim()), vs: p.verses })).filter(p => p.t);
  let test = 'NT', libro = 39, visibles = 80;
  const conPeri = LIBROS.map((_, i) => Object.keys(D).some(k => k.startsWith(COD[i] + '-')));
  function pintarLibros() {
    $('libros').innerHTML = LIBROS.map((b, i) => ({ b, i })).filter(({ i }) => (test === 'AT' ? i < 39 : i >= 39) && conPeri[i])
      .map(({ b, i }) => `<button class="chip" type="button" data-i="${i}" aria-pressed="${i === libro}">${esc(b)}</button>`).join('');
  }
  function pintar() {
    const q = normal($('q').value.trim());
    let html = '', n = 0;
    if (q) {
      for (let i = 0; i < LIBROS.length && n < visibles; i++) for (let c = 1; c <= 150 && n < visibles; c++) {
        if (!D[`${COD[i]}-${c}`]) continue;
        de(i, c).filter(p => normal(p.t).includes(q)).forEach(p => { if (n++ < visibles) html += `<a class="per" href="${leer(LIBROS[i], p.c, p.v)}"><span><small>${esc(LIBROS[i])} ${p.c}:${p.vs || p.v}</small>${esc(p.t)}</span>${CHEV}</a>`; });
      }
      $('sub').textContent = n ? (n >= visibles ? `Más de ${visibles} resultados` : `${n} resultados`) : 'Sin resultados';
    } else {
      for (let c = 1; c <= 150; c++) {
        const ps = de(libro, c); if (!ps.length) continue;
        html += `<h3 class="cap-g">Capítulo ${c}</h3>` + ps.map(p => `<a class="per" href="${leer(LIBROS[libro], p.c, p.v)}"><span><small>${esc(LIBROS[libro])} ${p.c}:${p.vs || p.v}</small>${esc(p.t)}</span>${CHEV}</a>`).join('');
        n += ps.length;
      }
      $('sub').textContent = `${LIBROS[libro]} · ${n} perícopas`;
    }
    $('lista').innerHTML = html || '<p class="vacio">No hay perícopas para mostrar.</p>';
    $('mas').hidden = !(q && n >= visibles);
  }
  document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
    test = b.dataset.t; document.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    libro = test === 'AT' ? conPeri.findIndex(x => x) : 39 + conPeri.slice(39).findIndex(x => x); pintarLibros(); pintar();
  }));
  $('libros').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; libro = parseInt(b.dataset.i, 10); pintarLibros(); pintar(); });
  $('q').addEventListener('input', () => { visibles = 80; pintar(); });
  $('mas').addEventListener('click', () => { visibles += 80; pintar(); });
  pintarLibros(); pintar();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="cuenta.js"></script>
</body>
</html>
