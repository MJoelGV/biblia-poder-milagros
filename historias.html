  let cat = 'todos';
  $('cats').innerHTML = Object.entries(CATS).map(([k, v]) => `<button class="chip" type="button" data-cat="${k}" aria-pressed="${k === cat}">${v}</button>`).join('');
  const sigla = n => n.replace(/^(\d)\s*/, '$1').slice(0, n.match(/^\d/) ? 3 : 2);
  function pintar() {
    const q = normal($('q').value.trim());
    const lista = Object.entries(DATOS).filter(([n, d]) => (cat === 'todos' || d.testament === cat || d.category === cat)
      && (!q || normal(`${n} ${d.author} ${d.theme} ${(d.keyTopics || []).join(' ')}`).includes(q))).sort((a, b) => ORDEN.indexOf(a[0]) - ORDEN.indexOf(b[0]));
    $('sub').textContent = lista.length === 66 ? 'Introducción a los 66 libros de la Biblia' : `${lista.length} de 66 libros`;
    $('lista').innerHTML = lista.map(([n, d]) => `<article class="tarjeta"><button class="cab" type="button" aria-expanded="false">
        <span class="ico-libro" style="background:${COLOR[d.category] || '#2E7D32'}" aria-hidden="true">${esc(sigla(n))}</span>

      </div></article>`).join('') || '<p class="vacio">No hay libros con esa búsqueda.</p>';
  }
  $('q').addEventListener('input', pintar);
  $('cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; document.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); pintar(); });
