<html lang="es">
<head>
<meta charset="UTF-8">

<title>Predicaciones · Biblia de Poder y Milagros</title>
</head>
<body>
<main class="page">
  <section class="reproductor" id="reproductor" hidden aria-label="Reproductor de video">
    <div class="marco"><div id="yt"></div></div>
    <div class="rep-barra">
      <button class="rb" type="button" id="r-ant" aria-label="Video anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 20 9 12l10-8z" fill="currentColor"/><path d="M5 19V5"/></svg></button>
      <b id="r-tit"></b>
      <button class="rb" type="button" id="r-sig" aria-label="Video siguiente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 10 8-10 8z" fill="currentColor"/><path d="M19 5v14"/></svg></button>
      <button class="rb" type="button" id="r-cerrar" aria-label="Cerrar el video"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </section>

  <header class="pt"><a class="atras" href="predicaciones.html" aria-label="Volver a Predicaciones"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a><div><h1 id="titulo" style="font-size:22px">Predicaciones</h1><small id="cuenta">Cargando…</small></div></header>
  <label class="buscador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Buscar en esta lista</span><input id="buscar" type="search" placeholder="Buscar en esta lista" autocomplete="off"></label>
  <div class="vids" id="vids"></div>
  <button class="btn sec mas" type="button" id="mas" hidden style="background:transparent;color:var(--text);border:1px solid var(--border);padding:0 20px">Mostrar más</button>
</main>

<nav class="tabbar" aria-label="Navegación principal"><div class="in">
  <a href="index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="lectura.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/><path d="M12 6v8M9 9h6"/></svg>Biblia</a>
  <a href="planes-estudio.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg>Planes</a>
  <a href="predicaciones.html" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>Prédicas</a>
  <a href="mas.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Más</a>
</div></nav>

<script>
(function () {
  'use strict';

  const KEY = 'AIzaSyA5B2vj3m6lMWRrMrF7LP7xD3PsPVTjBzM', CANAL = 'UCh2_5mMqBEFlYdxg81Rys_Q', SUBIDAS = 'UUh2_5mMqBEFlYdxg81Rys_Q';
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const normal = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const PLAYMINI = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
  function hace(f) {
    const d = Math.floor((Date.now() - new Date(f).getTime()) / 86400000);
    if (d <= 0) return 'Hoy'; if (d === 1) return 'Ayer'; if (d < 7) return `Hace ${d} días`;
    if (d < 30) { const s = Math.floor(d / 7); return s === 1 ? 'Hace 1 semana' : `Hace ${s} semanas`; }
    return new Date(f).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  // Guarda respuestas un tiempo para no gastar la cuota diaria de YouTube
  function deCache(k, horas) { try { const c = JSON.parse(localStorage.getItem(k)); if (c && Date.now() - c.t < horas * 3600000) return c.d; } catch (e) {} return null; }
  function aCache(k, d) { try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), d })); } catch (e) {} }
  async function yt(ruta) {
    const r = await fetch(`https://www.googleapis.com/youtube/v3/${ruta}&key=${KEY}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('YouTube ' + r.status);
    return r.json();
  }
  async function videosDe(lista, max) {
    let todos = [], token = '';
    do {
      const d = await yt(`playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${lista}${token ? '&pageToken=' + token : ''}`);
      todos = todos.concat(d.items || []);
      token = d.nextPageToken || '';
    } while (token && todos.length < (max || 2000));
    return todos.filter(x => !/^(private|deleted) video$/i.test(x.snippet?.title || ''))
      .map(x => ({ id: x.contentDetails?.videoId || x.snippet?.resourceId?.videoId, titulo: x.snippet?.title || '', fecha: x.contentDetails?.videoPublishedAt || x.snippet?.publishedAt }))
      .filter(x => x.id).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  }
  const miniatura = id => `<span class="mini"><img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><span class="play">${PLAYMINI}</span></span>`;

  const params = new URLSearchParams(location.search);
  const LISTA = params.get('id') || SUBIDAS;
  const NOMBRE = params.get('name') || 'Predicaciones';
  $('titulo').textContent = NOMBRE; document.title = `${NOMBRE} · Biblia de Poder y Milagros`;
  let videos = [], visibles = 40, actual = -1, player = null, listo = false, pendiente = null;

  function filtrados() { const q = normal($('buscar').value.trim()); return videos.map((v, i) => ({ ...v, i })).filter(v => !q || normal(v.titulo).includes(q)); }
  function pintar() {
    const f = filtrados();
    $('vids').innerHTML = f.slice(0, visibles).map(v => `<button class="vid${v.i === actual ? ' sonando' : ''}" type="button" data-i="${v.i}"${v.i === actual ? ' aria-current="true"' : ''}>${miniatura(v.id)}<span class="tx"><b>${esc(v.titulo)}</b><span class="meta">${hace(v.fecha)}</span></span></button>`).join('')
      || '<p class="error">No hay videos con esa búsqueda.</p>';
    $('mas').hidden = f.length <= visibles;
  }
  $('buscar').addEventListener('input', () => { visibles = 40; pintar(); });
  $('mas').addEventListener('click', () => { visibles += 40; pintar(); });
  $('vids').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) reproducir(parseInt(b.dataset.i, 10)); });

  // ---------- Reproductor de YouTube (visible, con sus controles y el botón de omitir anuncios) ----------
  function cargarAPI() {
    if (window.YT && window.YT.Player) return crear();
    window.onYouTubeIframeAPIReady = crear;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  function crear() {
    player = new YT.Player('yt', {
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => { listo = true; if (pendiente !== null) { const p = pendiente; pendiente = null; reproducir(p); } },
        onStateChange: ev => { if (ev.data === YT.PlayerState.ENDED && actual < videos.length - 1) reproducir(actual + 1); }
      }
    });
  }
  function reproducir(i) {
    if (i < 0 || i >= videos.length) return;
    actual = i;
    if (!$('buscar').value.trim()) visibles = Math.max(visibles, Math.ceil((i + 1) / 40) * 40);
    $('reproductor').hidden = false;
    $('r-tit').textContent = videos[i].titulo;
    $('r-ant').disabled = i === 0; $('r-sig').disabled = i === videos.length - 1;
    pintar();
    window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    if (!player) { pendiente = i; cargarAPI(); return; }
    if (!listo) { pendiente = i; return; }
    player.loadVideoById(videos[i].id);
  }
  $('r-ant').addEventListener('click', () => reproducir(actual - 1));
  $('r-sig').addEventListener('click', () => reproducir(actual + 1));
  $('r-cerrar').addEventListener('click', () => { if (player && listo) player.stopVideo(); $('reproductor').hidden = true; actual = -1; pintar(); });

  // ---------- Cargar la lista ----------
  (async function () {
    let v = deCache('pl:' + LISTA, 1);
    try { if (!v) { v = await videosDe(LISTA); aCache('pl:' + LISTA, v); } }
    catch (e) { $('cuenta').textContent = ''; $('vids').innerHTML = '<p class="error">No se pudo cargar esta lista. Revisa tu conexión e inténtalo de nuevo.</p>'; return; }
    videos = v;
    $('cuenta').textContent = v.length === 1 ? '1 video' : `${v.length} videos · del más nuevo al más antiguo`;
    pintar();
    const elegido = params.get('v');
    if (elegido) { const i = videos.findIndex(x => x.id === elegido); if (i >= 0) reproducir(i); }
  })();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
})();
</script>
<script type="module" src="cuenta.js"></script>
</body>
</html>
