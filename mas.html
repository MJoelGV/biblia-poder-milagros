<script>
(function () {
  const botones = document.querySelectorAll('[data-tema]');
  function marcar() { const t = window.temaApp.actual(); botones.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tema === t))); }
  botones.forEach(b => b.addEventListener('click', () => { window.temaApp.elegir(b.dataset.tema); marcar(); }));
  marcar();

  document.getElementById('compartir-app').addEventListener('click', async () => {
    const url = new URL('./', location.href).href;
    const datos = { title: 'Biblia de Poder y Milagros', text: 'Lee, escucha y estudia la Biblia con esta app:', url };
    try {
      if (navigator.share) await navigator.share(datos);
      else { await navigator.clipboard.writeText(url); alert('Enlace copiado: ' + url); }
    } catch (e) {}
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(console.error);
})();
</script>
